const totalPages = Math.ceil(FILES.length / PER_PAGE);

function clearChildren(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function getPageFromHash() {
  const m = location.hash.match(/page=(\d+)/);
  const p = m ? parseInt(m[1], 10) : 1;
  return Math.min(Math.max(p, 1), totalPages);
}

function setPage(p) {
  location.hash = "page=" + p;
}

function buildPager(current) {
  const pager = document.getElementById("pager");
  clearChildren(pager);

  const prev = document.createElement("button");
  prev.textContent = "<";
  prev.disabled = current === 1;
  prev.onclick = () => setPage(current - 1);
  pager.appendChild(prev);

  const pages = new Set([1, totalPages, current, current - 1, current + 1]);
  const sorted = [...pages].filter(p => p >= 1 && p <= totalPages).sort((a,b)=>a-b);

  let last = 0;
  for (const p of sorted) {
    if (p - last > 1) {
      const e = document.createElement("span");
      e.className = "ellipsis";
      e.textContent = "...";
      pager.appendChild(e);
    }
    const b = document.createElement("button");
    b.className = "page-num" + (p === current ? " active" : "");
    b.textContent = String(p);
    b.onclick = () => setPage(p);
    pager.appendChild(b);
    last = p;
  }

  const next = document.createElement("button");
  next.textContent = ">";
  next.disabled = current === totalPages;
  next.onclick = () => setPage(current + 1);
  pager.appendChild(next);
}

function render() {
  const page = getPageFromHash();
  const start = (page - 1) * PER_PAGE;
  const end = Math.min(start + PER_PAGE, FILES.length);
  const slice = FILES.slice(start, end);

  document.getElementById("meta").textContent =
    FILES.length + " files - page " + page + " / " + totalPages +
    " - showing " + (start + 1) + "-" + end;
  document.getElementById("footer-meta").textContent =
    "page " + page + " / " + totalPages;

  const grid = document.getElementById("grid");
  clearChildren(grid);
  slice.forEach((name, i) => {
    const card = document.createElement("div");

    fileDiv.appendChild(indexSpan);
    fileDiv.appendChild(document.createTextNode(name));
    label.appendChild(fileDiv);

    card.appendChild(v);
    card.appendChild(label);
    grid.appendChild(card);
  });

  buildPager(page);
  window.scrollTo({ top: 0, behavior: "instant" });
}
