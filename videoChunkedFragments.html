<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunked Video Loader - Using Media Fragments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .log-panel {
            width: 350px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 20px;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }
        
        .log-content {
            flex: 1;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.4;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 6px;
            border-left: 3px solid #444;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .log-entry.info { border-left-color: #4CAF50; }
        .log-entry.warning { border-left-color: #ffa500; }
        .log-entry.error { border-left-color: #ff4444; }
        .log-entry.success { border-left-color: #00ff00; }
        
        .log-timestamp {
            color: #888;
            font-size: 11px;
        }
        
        .log-message {
            color: #e0e0e0;
            margin-top: 2px;
            word-wrap: break-word;
        }
        
        .container {
            flex: 1;
            max-width: 1200px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .url-input-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .video-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .canvas-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            background: #000;
            border-radius: 4px;
            padding: 10px;
        }
        
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #444;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .info-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            border-left: 3px solid #4CAF50;
        }
        
        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        
        .timeline {
            width: 100%;
            height: 60px;
            background: #1a1a1a;
            border-radius: 4px;
            position: relative;
            margin: 20px 0;
            cursor: pointer;
        }
        
        .timeline-segment {
            position: absolute;
            height: 100%;
            background: #333;
            border-right: 1px solid #555;
        }
        
        .timeline-segment.loaded {
            background: #4CAF50;
            opacity: 0.3;
        }
        
        .timeline-position {
            position: absolute;
            width: 2px;
            height: 100%;
            background: #ff0000;
            pointer-events: none;
            z-index: 10;
        }
        
        .load-more-section {
            text-align: center;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .load-more-section.visible {
            display: block;
        }
        
        .speed-btn {
            padding: 5px 10px;
            font-size: 12px;
            background: #333;
        }
        
        .speed-btn.active {
            background: #4CAF50;
        }
        
        select {
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        label {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- Log Panel -->
        <div class="log-panel">
            <div class="log-header">
                <div class="log-title">📋 Activity Log</div>
                <div class="log-controls">
                    <button onclick="clearLog()" style="padding: 4px 8px; font-size: 12px;">Clear</button>
                </div>
            </div>
            <div class="log-content" id="logContent"></div>
        </div>
        
        <!-- Main Content -->
        <div class="container">
            <h1>🎬 Media Fragment Video Loader</h1>
            
            <!-- URL Input Section -->
            <div class="url-input-section">
                <div class="input-group">
                    <input type="text" id="videoUrl" placeholder="Enter video URL (e.g., https://example.com/video.mp4)" />
                    <button id="loadBtn" onclick="loadVideo()">Load Video</button>
                </div>
                <div class="input-group">
                    <label>Segment Duration:</label>
                    <select id="segmentDuration">
                        <option value="5">5 seconds</option>
                        <option value="10" selected>10 seconds</option>
                        <option value="15">15 seconds</option>
                        <option value="20">20 seconds</option>
                    </select>
                    <label style="margin-left: 20px;">Max Segments in Memory:</label>
                    <select id="maxSegments">
                        <option value="1">1 segment</option>
                        <option value="2" selected>2 segments</option>
                        <option value="3">3 segments</option>
                    </select>
                </div>
            </div>
            
            <!-- Info Panel -->
            <div class="info-panel">
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Current Segment</div>
                        <div class="info-value" id="currentSegment">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Loaded Segments</div>
                        <div class="info-value" id="loadedSegments">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Total Frames</div>
                        <div class="info-value" id="totalFrames">0</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Current Frame</div>
                        <div class="info-value" id="currentFrame">0</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Time</div>
                        <div class="info-value" id="currentTime">0:00 / 0:00</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Memory Usage</div>
                        <div class="info-value" id="memoryUsage">0 MB</div>
                    </div>
                </div>
            </div>
            
            <!-- Video Section -->
            <div class="video-section">
                <div class="canvas-container">
                    <canvas id="videoCanvas"></canvas>
                </div>
                
                <!-- Timeline -->
                <div class="timeline" id="timeline">
                    <div class="timeline-position" id="timelinePosition"></div>
                </div>
                
                <!-- Controls -->
                <div class="controls">
                    <button id="playBtn" onclick="togglePlayback()">▶️ Play</button>
                    <button onclick="previousFrame()">⏮️ Prev Frame</button>
                    <button onclick="nextFrame()">⏭️ Next Frame</button>
                    <button onclick="jumpToSegment(-1)">⏪ Prev Segment</button>
                    <button onclick="jumpToSegment(1)">⏩ Next Segment</button>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="setSpeed(0.5)" class="speed-btn">0.5x</button>
                        <button onclick="setSpeed(1)" class="speed-btn active">1x</button>
                        <button onclick="setSpeed(2)" class="speed-btn">2x</button>
                    </div>
                </div>
            </div>
            
            <!-- Load More Section -->
            <div class="load-more-section" id="loadMoreSection">
                <p style="color: #ffa500; margin-bottom: 10px;">⚠️ Approaching end of loaded segments</p>
                <button onclick="loadNextSegment()">Load Next Segment</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        import getVideoFrames from './mod.js';
        
        // Global state
        let videoUrl = '';
        let baseUrl = '';  // URL without fragment
        let segments = [];  // Array of segment objects with frames
        let currentSegmentIndex = 0;
        let currentFrameIndex = 0;
        let totalSegments = 0;
        let segmentDurationSeconds = 10;
        let maxSegmentsInMemory = 2;
        let fps = 60;
        let isPlaying = false;
        let playbackSpeed = 1;
        let animationId = null;
        let lastFrameTime = 0;
        let totalVideoDuration = 0;
        let isLoadingSegment = false;
        
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        
        // Make functions global
        window.loadVideo = loadVideo;
        window.togglePlayback = togglePlayback;
        window.previousFrame = previousFrame;
        window.nextFrame = nextFrame;
        window.jumpToSegment = jumpToSegment;
        window.setSpeed = setSpeed;
        window.loadNextSegment = loadNextSegment;
        window.clearLog = clearLog;
        
        // Logging
        function addLog(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                fractionalSecondDigits: 3
            });
            
            entry.innerHTML = `
                <div class="log-timestamp">[${timestamp}]</div>
                <div class="log-message">${message}</div>
            `;
            
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('logContent').innerHTML = '';
            addLog('Log cleared', 'info');
        }
        
        // Initialize
        function init() {
            addLog('Media Fragment Loader initialized', 'success');
            addLog('This version uses #t=start,end URL fragments', 'info');
            
            const urlParams = new URLSearchParams(window.location.search);
            const url = urlParams.get('url');
            if (url) {
                document.getElementById('videoUrl').value = url;
                loadVideo();
            }
            
            document.getElementById('timeline').addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percentage = x / rect.width;
                
                // Find which segment was clicked
                const totalFrames = getTotalLoadedFrames();
                const targetFrame = Math.floor(totalFrames * percentage);
                seekToGlobalFrame(targetFrame);
            });
        }
        
        async function loadVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            if (!url) {
                addLog('Please enter a video URL', 'error');
                return;
            }
            
            // Remove any existing fragment
            baseUrl = url.split('#')[0];
            videoUrl = url;
            
            segmentDurationSeconds = parseInt(document.getElementById('segmentDuration').value);
            maxSegmentsInMemory = parseInt(document.getElementById('maxSegments').value);
            
            // Reset state
            segments = [];
            currentSegmentIndex = 0;
            currentFrameIndex = 0;
            isPlaying = false;
            
            addLog(`Loading video: ${baseUrl}`, 'info');
            addLog(`Segment duration: ${segmentDurationSeconds}s, Max in memory: ${maxSegmentsInMemory}`, 'info');
            
            try {
                // Get video metadata
                await getVideoMetadata(baseUrl);
                
                // Setup timeline
                setupTimeline();
                
                // Load first segment
                await loadSegment(0);
                
            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
            }
        }
        
        async function getVideoMetadata(url) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.src = url;
                
                video.addEventListener('loadedmetadata', () => {
                    totalVideoDuration = video.duration;
                    totalSegments = Math.ceil(totalVideoDuration / segmentDurationSeconds);
                    
                    addLog('Video metadata loaded:', 'success');
                    addLog(`Duration: ${formatTime(totalVideoDuration)}`, 'info');
                    addLog(`Resolution: ${video.videoWidth}x${video.videoHeight}`, 'info');
                    addLog(`Total segments: ${totalSegments} (${segmentDurationSeconds}s each)`, 'info');
                    
                    video.remove();
                    resolve();
                });
                
                video.addEventListener('error', () => {
                    video.remove();
                    reject(new Error('Failed to load video metadata'));
                });
            });
        }
        
        function setupTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '<div class="timeline-position" id="timelinePosition"></div>';
            
            // Add segment indicators
            for (let i = 0; i < totalSegments; i++) {
                const segment = document.createElement('div');
                segment.className = 'timeline-segment';
                segment.style.left = `${(i / totalSegments) * 100}%`;
                segment.style.width = `${(1 / totalSegments) * 100}%`;
                segment.id = `segment-${i}`;
                timeline.appendChild(segment);
            }
        }
        
        async function loadSegment(segmentIndex) {
            if (isLoadingSegment || segmentIndex >= totalSegments) return;
            if (segments.find(s => s.index === segmentIndex)) {
                addLog(`Segment ${segmentIndex + 1} already loaded`, 'info');
                return;
            }
            
            isLoadingSegment = true;
            
            const startTime = segmentIndex * segmentDurationSeconds;
            const endTime = Math.min(startTime + segmentDurationSeconds, totalVideoDuration);
            
            // Create URL with media fragment
            const fragmentUrl = `${baseUrl}#t=${startTime},${endTime}`;
            
            addLog(`Loading segment ${segmentIndex + 1}/${totalSegments}`, 'info');
            addLog(`Time range: ${formatTime(startTime)} - ${formatTime(endTime)}`, 'info');
            addLog(`URL: ${fragmentUrl}`, 'info');
            
            const segmentFrames = [];
            const startLoadTime = performance.now();
            
            try {
                await getVideoFrames({
                    videoUrl: fragmentUrl,
                    async onFrame(frame) {
                        const img = await createImageBitmap(frame);
                        segmentFrames.push(img);
                        
                        if (segmentFrames.length % 100 === 0) {
                            addLog(`Loaded ${segmentFrames.length} frames...`, 'info');
                        }
                        
                        // Setup canvas on first frame
                        if (segments.length === 0 && segmentFrames.length === 1) {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            addLog(`Canvas: ${img.width}x${img.height}`, 'info');
                        }
                        
                        frame.close();
                    },
                    onConfig(config) {
                        addLog(`Codec: ${config.codec}`, 'info');
                    },
                    onFinish() {
                        const loadTime = ((performance.now() - startLoadTime) / 1000).toFixed(2);
                        addLog(`Segment ${segmentIndex + 1} loaded: ${segmentFrames.length} frames in ${loadTime}s`, 'success');
                    }
                });
                
                // Add segment to array
                segments.push({
                    index: segmentIndex,
                    frames: segmentFrames,
                    startTime: startTime,
                    endTime: endTime
                });
                
                // Sort segments by index
                segments.sort((a, b) => a.index - b.index);
                
                // Mark segment as loaded in timeline
                const segmentEl = document.getElementById(`segment-${segmentIndex}`);
                if (segmentEl) segmentEl.classList.add('loaded');
                
                // Clean up old segments if needed
                cleanupOldSegments();
                
                // Render first frame if this is the first segment
                if (segments.length === 1 && segmentFrames.length > 0) {
                    renderFrame(0);
                }
                
                updateUI();
                
            } catch (error) {
                addLog(`Failed to load segment ${segmentIndex + 1}: ${error.message}`, 'error');
            } finally {
                isLoadingSegment = false;
            }
        }
        
        function cleanupOldSegments() {
            while (segments.length > maxSegmentsInMemory) {
                // Find segment furthest from current
                let removeIndex = 0;
                let maxDistance = 0;
                
                segments.forEach((seg, idx) => {
                    const distance = Math.abs(seg.index - currentSegmentIndex);
                    if (distance > maxDistance) {
                        maxDistance = distance;
                        removeIndex = idx;
                    }
                });
                
                const removed = segments.splice(removeIndex, 1)[0];
                addLog(`Memory cleanup: Removed segment ${removed.index + 1}`, 'warning');
                
                // Update timeline
                const segmentEl = document.getElementById(`segment-${removed.index}`);
                if (segmentEl) segmentEl.classList.remove('loaded');
            }
        }
        
        async function loadNextSegment() {
            const nextIndex = Math.max(...segments.map(s => s.index)) + 1;
            if (nextIndex < totalSegments) {
                await loadSegment(nextIndex);
            }
        }
        
        function getCurrentSegment() {
            return segments.find(s => s.index === currentSegmentIndex);
        }
        
        function getTotalLoadedFrames() {
            return segments.reduce((total, seg) => total + seg.frames.length, 0);
        }
        
        function renderFrame(localIndex) {
            const segment = getCurrentSegment();
            if (!segment || localIndex < 0 || localIndex >= segment.frames.length) return;
            
            ctx.drawImage(segment.frames[localIndex], 0, 0, canvas.width, canvas.height);
            currentFrameIndex = localIndex;
            updateUI();
            checkNeedMoreSegments();
        }
        
        function checkNeedMoreSegments() {
            const segment = getCurrentSegment();
            if (!segment) return;
            
            // Show load more button if near end of segment and more segments exist
            const nearEnd = currentFrameIndex > segment.frames.length * 0.8;
            const hasMore = Math.max(...segments.map(s => s.index)) < totalSegments - 1;
            
            document.getElementById('loadMoreSection').classList.toggle('visible', nearEnd && hasMore);
        }
        
        function togglePlayback() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
            
            if (isPlaying) {
                addLog(`Playing at ${playbackSpeed}x`, 'info');
                lastFrameTime = performance.now();
                animate();
            } else {
                addLog('Paused', 'info');
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            }
        }
        
        function animate(currentTime) {
            if (!isPlaying) return;
            
            const deltaTime = currentTime - lastFrameTime;
            const frameDuration = 1000 / (fps * playbackSpeed);
            
            if (deltaTime >= frameDuration) {
                const segment = getCurrentSegment();
                if (segment && currentFrameIndex < segment.frames.length - 1) {
                    renderFrame(currentFrameIndex + 1);
                    lastFrameTime = currentTime;
                } else {
                    // Try to move to next segment
                    const nextSegment = segments.find(s => s.index === currentSegmentIndex + 1);
                    if (nextSegment) {
                        currentSegmentIndex++;
                        currentFrameIndex = 0;
                        renderFrame(0);
                        addLog(`Moving to segment ${currentSegmentIndex + 1}`, 'info');
                    } else {
                        isPlaying = false;
                        document.getElementById('playBtn').textContent = '▶️ Play';
                        addLog('End of loaded segments', 'warning');
                    }
                }
            }
            
            if (isPlaying) {
                animationId = requestAnimationFrame(animate);
            }
        }
        
        function previousFrame() {
            if (currentFrameIndex > 0) {
                renderFrame(currentFrameIndex - 1);
            }
        }
        
        function nextFrame() {
            const segment = getCurrentSegment();
            if (segment && currentFrameIndex < segment.frames.length - 1) {
                renderFrame(currentFrameIndex + 1);
            }
        }
        
        function jumpToSegment(direction) {
            const newIndex = currentSegmentIndex + direction;
            const newSegment = segments.find(s => s.index === newIndex);
            
            if (newSegment) {
                currentSegmentIndex = newIndex;
                currentFrameIndex = 0;
                renderFrame(0);
                addLog(`Jumped to segment ${newIndex + 1}`, 'info');
            } else if (newIndex >= 0 && newIndex < totalSegments) {
                // Need to load this segment
                loadSegment(newIndex).then(() => {
                    currentSegmentIndex = newIndex;
                    currentFrameIndex = 0;
                    renderFrame(0);
                });
            }
        }
        
        function seekToGlobalFrame(globalFrameIndex) {
            let frameCount = 0;
            for (const segment of segments) {
                if (frameCount + segment.frames.length > globalFrameIndex) {
                    currentSegmentIndex = segment.index;
                    currentFrameIndex = globalFrameIndex - frameCount;
                    renderFrame(currentFrameIndex);
                    addLog(`Seeked to segment ${segment.index + 1}, frame ${currentFrameIndex}`, 'info');
                    return;
                }
                frameCount += segment.frames.length;
            }
        }
        
        function setSpeed(speed) {
            playbackSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            addLog(`Speed: ${speed}x`, 'info');
        }
        
        function updateUI() {
            const segment = getCurrentSegment();
            
            // Segment info
            document.getElementById('currentSegment').textContent = 
                segment ? `${segment.index + 1} / ${totalSegments}` : '-';
            
            document.getElementById('loadedSegments').textContent = 
                segments.map(s => s.index + 1).join(', ');
            
            // Frame info
            document.getElementById('totalFrames').textContent = getTotalLoadedFrames();
            
            document.getElementById('currentFrame').textContent = 
                segment ? `${currentFrameIndex + 1} / ${segment.frames.length}` : '0';
            
            // Time
            if (segment) {
                const currentTime = segment.startTime + (currentFrameIndex / fps);
                const segmentDuration = segment.endTime - segment.startTime;
                document.getElementById('currentTime').textContent = 
                    `${formatTime(currentTime)} / ${formatTime(totalVideoDuration)}`;
            }
            
            // Memory
            if (canvas.width && segments.length > 0) {
                const bytesPerFrame = canvas.width * canvas.height * 4;
                const totalFrames = getTotalLoadedFrames();
                const memoryMB = (totalFrames * bytesPerFrame / 1024 / 1024).toFixed(1);
                document.getElementById('memoryUsage').textContent = `${memoryMB} MB`;
            }
            
            // Timeline position
            if (segment && totalVideoDuration > 0) {
                const currentTime = segment.startTime + (currentFrameIndex / fps);
                const percentage = (currentTime / totalVideoDuration) * 100;
                document.getElementById('timelinePosition').style.left = `${percentage}%`;
            }
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        init();
    </script>
</body>
</html>
