<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verwijderd · Klaar · met glossen — ZIN</title>
<style>
  :root{--bg:#0f1216;--panel:#171c22;--panel2:#1f262e;--line:#2a323c;--text:#e6edf3;--muted:#8b97a5;
        --accent:#3fb950;--accent-d:#2ea043;--gold:#ffd866;--blue:#a5d6ff;--danger:#f85149;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  header{position:sticky;top:0;z-index:20;background:rgba(15,18,22,.93);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:13px 20px;}
  .hrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;}
  h1{font-size:17px;margin:0;font-weight:650;}
  h1 .sub{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px;}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--text);
       border-radius:8px;padding:8px 12px;width:230px;font-size:14px;}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted);}
  .pill b{color:var(--text);}
  main{max-width:1600px;margin:0 auto;padding:18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;
        display:flex;flex-direction:column;transition:opacity .3s,transform .3s;}
  .card.removing{opacity:0;transform:scale(.95);}
  .thumb{position:relative;aspect-ratio:16/11;background:#000;cursor:pointer;overflow:hidden;}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:contain;display:block;background:#000;}
  .thumb .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        color:var(--muted);font-size:12px;text-align:center;padding:10px;}
  .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        font-size:34px;color:rgba(255,255,255,.85);text-shadow:0 2px 8px #000;pointer-events:none;}
  .thumb .gbadge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:var(--gold);
        font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;}
  .thumb .vid{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#cfd8e3;
        font-size:10.5px;padding:2px 7px;border-radius:999px;}
  .body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .zin{font-size:14px;font-weight:600;line-height:1.35;}
  .thema{font-size:11px;color:var(--blue);}
  .statuses{display:flex;flex-wrap:wrap;gap:4px;}
  .st{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);}
  .st.klaar{color:#9fe0a0;border-color:#27482b;background:#16241a;}
  .actions{display:flex;gap:7px;margin-top:auto;}
  button{font:inherit;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;}
  .undelete{background:var(--accent);color:#04260c;flex:1;}
  .undelete:hover{background:var(--accent-d);color:#fff;}
  .undelete:disabled{opacity:.6;cursor:default;}
  .srt{background:var(--panel2);border:1px solid var(--line);color:var(--muted);text-decoration:none;
       display:inline-flex;align-items:center;padding:8px 11px;border-radius:8px;}
  .srt:hover{color:var(--gold);}
  .status{color:var(--muted);font-size:13px;padding:10px 0;}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
         background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 18px;
         border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{border-color:var(--danger);color:#ffc4c0;}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Verwijderd · Klaar · mét glossen
        <span class="sub">added=0 · ≥1 gloss · minstens één status = Klaar</span></h1>
    <div class="controls">
      <input type="search" id="search" placeholder="Zoek in zin…" autocomplete="off">
      <select id="thema"><option value="">Alle thema's</option></select>
      <span class="pill"><b id="shown">0</b>/<b id="count">…</b> getoond</span>
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="status" id="msg">Laden…</div>
</main>
<div id="toast"></div>

<script>
const API='getZinnen.php';
let DATA=[];
const grid=document.getElementById('grid'),msg=document.getElementById('msg');
const searchEl=document.getElementById('search'),themaEl=document.getElementById('thema');

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function card(v){
  const c=document.createElement('div');
  c.className='card'; c.dataset.id=v.video_id;
  c.dataset.zin=(v.zin||'').toLowerCase(); c.dataset.thema=v.thema||'';
  const stOrder=['video','annotatie','glos','gvg'];
  const stHtml=stOrder.map(k=>{
    const val=v.statuses[k]||'—';
    const on=val==='Klaar'?' klaar':'';
    return `<span class="st${on}" title="status_${k}">${k}: ${esc(val)}</span>`;
  }).join('');
  c.innerHTML=`
    <div class="thumb" title="Klik om af te spelen">
      <img src="${esc(v.thumb_url)}" loading="lazy" alt=""
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="noimg" style="display:none">geen thumbnail<br>(klik = video)</div>
      <div class="play">▶</div>
      <div class="gbadge">${v.gloss_items} gloss</div>
      <div class="vid">#${v.video_id}</div>
    </div>
    <div class="body">
      <div class="thema">${esc(v.thema)}</div>
      <div class="zin">${esc(v.zin)}</div>
      <div class="statuses">${stHtml}</div>
      <div class="actions">
        <button class="undelete">↩ Terugzetten</button>
        <a class="srt" href="${esc(v.gloss_srt_url)}" target="_blank" title="Open gloss SRT">SRT</a>
      </div>
    </div>`;
  // click thumbnail → swap in playable video with gloss captions
  c.querySelector('.thumb').addEventListener('click',function(){ playInline(this,v); });
  c.querySelector('.undelete').addEventListener('click',()=>undelete(c));
  return c;
}

async function playInline(thumb,v){
  if(thumb.dataset.playing) return;
  thumb.dataset.playing='1';
  thumb.innerHTML='';
  const video=document.createElement('video');
  video.controls=true; video.autoplay=true; video.playsInline=true; video.crossOrigin='anonymous';
  video.src=v.m_url;
  thumb.appendChild(video);
  try{
    const res=await fetch(v.gloss_srt_url,{cache:'force-cache'});
    if(res.ok){
      const srt=await res.text();
      const vtt='WEBVTT\n\n'+srt.replace(/\r+/g,'').trim().replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2');
      const url=URL.createObjectURL(new Blob([vtt],{type:'text/vtt'}));
      const t=document.createElement('track');
      t.kind='subtitles';t.label='glossen';t.srclang='nl';t.src=url;t.default=true;
      video.appendChild(t);
      t.addEventListener('load',()=>{if(video.textTracks[0])video.textTracks[0].mode='showing';});
    }
  }catch(e){}
}

async function undelete(c){
  const id=c.dataset.id, btn=c.querySelector('.undelete');
  btn.disabled=true; btn.textContent='Bezig…';
  try{
    const fd=new FormData(); fd.append('action','restoreVideo'); fd.append('videoId',id);
    const r=await fetch(API,{method:'POST',body:fd}); const d=await r.json();
    if(!d.success) throw new Error(d.error||'fout');
    c.classList.add('removing'); setTimeout(()=>{c.remove();render();},320);
    toast('Video #'+id+' teruggezet ✓');
  }catch(e){ btn.disabled=false; btn.textContent='↩ Terugzetten'; toast('Mislukt: '+e.message,true); }
}

function render(){
  const q=searchEl.value.trim().toLowerCase(), th=themaEl.value;
  let shown=0;
  for(const c of grid.children){
    const ok=(!q||c.dataset.zin.includes(q))&&(!th||c.dataset.thema===th);
    c.style.display=ok?'':'none'; if(ok)shown++;
  }
  document.getElementById('shown').textContent=shown;
}

async function init(){
  try{
    const res=await fetch('deleted_klaar_gloss.json',{cache:'no-cache'});
    const d=await res.json();
    DATA=d.videos||[];
    document.getElementById('count').textContent=DATA.length;
    const themas=[...new Set(DATA.map(v=>v.thema).filter(Boolean))].sort();
    for(const t of themas){const o=document.createElement('option');o.value=t;o.textContent=t;themaEl.appendChild(o);}
    const frag=document.createDocumentFragment();
    DATA.forEach(v=>frag.appendChild(card(v)));
    grid.appendChild(frag);
    msg.textContent = DATA.length ? '' : 'Geen records.';
    render();
  }catch(e){ msg.textContent='Fout bij laden: '+e.message; }
}
searchEl.addEventListener('input',render);
themaEl.addEventListener('change',render);
let tT; function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(tT);tT=setTimeout(()=>t.className='',2500);}
init();
</script>
</body>
</html>
