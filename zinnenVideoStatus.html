<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zinnen Video Status - ZIN Project</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Helvetica, sans-serif;
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        
        .summary-card {
            transition: transform 0.2s;
            cursor: pointer;
            border: none;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
        }
        
        .summary-card.active {
            border: 2px solid #0d6efd;
        }
        
        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .filter-section {
            background-color: white;
            padding: 20px;
            border-radius: 0.5rem;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
        
        .content-section {
            background-color: white;
            padding: 20px;
            border-radius: 0.5rem;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
            margin-bottom: 20px;
        }
        
        .video-thumbnail {
            width: 60px;
            height: 90px;
            object-fit: cover;
            background-color: black;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
        }
        
        .video-preview {
            position: absolute;
            background-color: white;
            border: 1px solid #ddd;
            padding: 10px;
            z-index: 1000;
            display: none;
            width: 200px;
            height: 300px;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
            border-radius: 0.5rem;
        }
        
        .video-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .zin-row {
            border-bottom: 1px solid #dee2e6;
            padding: 15px 0;
            transition: background-color 0.2s;
        }
        
        .zin-row:hover {
            background-color: #f8f9fa;
        }
        
        .zin-text {
            font-size: 1rem;
            margin-bottom: 5px;
        }
        
        .zin-meta {
            font-size: 0.875rem;
            color: #6c757d;
        }
        
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            margin-right: 5px;
        }
        
        .edit-icon {
            cursor: pointer;
            color: #0d6efd;
            margin-left: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .zin-row:hover .edit-icon {
            opacity: 1;
        }
        
        .zin-input {
            width: 100%;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            padding: 0.375rem 0.75rem;
        }
        
        .pagination-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #dee2e6;
        }
        
        .video-count-badge {
            background-color: #0d6efd;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            margin-left: 5px;
        }
        
        .export-btn {
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="display-5 mb-0">Zinnen Video Status</h1>
                <p class="text-muted">Overzicht van zinnen met en zonder video's</p>
            </div>
        </div>
        
        <!-- Summary Cards -->
        <div class="row mb-4" id="summaryCards">
            <div class="col-md-4">
                <div class="card summary-card" data-filter="all">
                    <div class="card-body text-center">
                        <i class="fas fa-list card-icon text-primary"></i>
                        <h3 class="card-title" id="totalCount">0</h3>
                        <p class="card-text text-muted mb-0">Totaal Zinnen</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card summary-card" data-filter="with-video">
                    <div class="card-body text-center">
                        <i class="fas fa-video card-icon text-success"></i>
                        <h3 class="card-title" id="withVideoCount">0</h3>
                        <p class="card-text text-muted mb-0">Met Video</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card summary-card" data-filter="without-video">
                    <div class="card-body text-center">
                        <i class="fas fa-video-slash card-icon text-danger"></i>
                        <h3 class="card-title" id="withoutVideoCount">0</h3>
                        <p class="card-text text-muted mb-0">Zonder Video</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Filter Section -->
        <div class="filter-section">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Thema</label>
                    <select class="form-select" id="themaFilter">
                        <option value="">Alle thema's</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Zoeken</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="Zoek in zinnen...">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status Video Controle</label>
                    <select class="form-select" id="statusVideoFilter">
                        <option value="">Alle</option>
                        <option value="0">Te doen</option>
                        <option value="Klaar">Klaar</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status GvG</label>
                    <select class="form-select" id="statusGvgFilter">
                        <option value="">Alle</option>
                        <option value="0">Te doen</option>
                        <option value="Klaar">Klaar</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">&nbsp;</label>
                    <button class="btn btn-primary w-100" id="applyFilters">
                        <i class="fas fa-filter"></i> Toepassen
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Content Sections -->
        <div id="contentArea">
            <!-- Zinnen with Videos Section -->
            <div class="content-section" id="withVideoSection">
                <div class="section-header">
                    <h3>Zinnen met Video's <span class="video-count-badge" id="withVideoSectionCount">0</span></h3>
                    <button class="btn btn-sm btn-outline-secondary export-btn" data-section="with-video">
                        <i class="fas fa-download"></i> Exporteer
                    </button>
                </div>
                <div id="withVideoContent">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p class="mt-2">Laden...</p>
                    </div>
                </div>
                <div class="pagination-container" id="withVideoPagination"></div>
            </div>
            
            <!-- Zinnen without Videos Section -->
            <div class="content-section" id="withoutVideoSection" style="display: none;">
                <div class="section-header">
                    <h3>Zinnen zonder Video's <span class="video-count-badge" id="withoutVideoSectionCount">0</span></h3>
                    <button class="btn btn-sm btn-outline-secondary export-btn" data-section="without-video">
                        <i class="fas fa-download"></i> Exporteer
                    </button>
                </div>
                <div id="withoutVideoContent">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p class="mt-2">Laden...</p>
                    </div>
                </div>
                <div class="pagination-container" id="withoutVideoPagination"></div>
            </div>
        </div>
        
        <!-- Video Preview Container -->
        <div class="video-preview" id="videoPreview"></div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script>
        // Global variables
        let allZinnen = [];
        let currentFilter = 'all';
        let currentPage = {
            withVideo: 1,
            withoutVideo: 1
        };
        const itemsPerPage = 5000;
        
        // Initialize on page load
        $(document).ready(function() {
            loadThemas();
            loadZinnen();
            attachEventHandlers();
        });
        
        // Load themas for filter dropdown
        function loadThemas() {
            $.ajax({
                url: 'getZinnen.php',
                type: 'GET',
                data: { action: 'fetchThemas' },
                success: function(response) {
                    if (response.success && response.themas) {
                        const themaSelect = $('#themaFilter');
                        response.themas.forEach(thema => {
                            themaSelect.append(`<option value="${thema}">${thema}</option>`);
                        });
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error loading themas:', error);
                }
            });
        }
        
        // Load all zinnen data
        function loadZinnen() {
            const filters = {
                action: '', // Default action for fetchSentences
                thema: $('#themaFilter').val(),
                search: $('#searchInput').val(),
                statusVideo: $('#statusVideoFilter').val(),
                statusGvg: $('#statusGvgFilter').val()
            };
            
            // Show loading spinners
            $('#withVideoContent').html('<div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p class="mt-2">Laden...</p></div>');
            $('#withoutVideoContent').html('<div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p class="mt-2">Laden...</p></div>');
            
            // Load all pages of data
            loadAllPages(filters);
        }
        
        // Load all pages of data from API
        function loadAllPages(filters) {
            allZinnen = [];
            let currentPage = 1;
            
            function loadPage() {
                const pageFilters = { ...filters, page: currentPage };
                
                $.ajax({
                    url: 'getZinnen.php',
                    type: 'GET',
                    data: pageFilters,
                    success: function(response) {
                        if (response.success) {
                            if (response.rows && response.rows.length > 0) {
                                // Note: userId filtering removed because userId field is not returned by the API
                                // To enable userId filtering, add 'sentences.userId' to the SELECT statement in getZinnen.php
                                allZinnen = allZinnen.concat(response.rows);
                                
                                // If we got a full page (25 items), there might be more
                                if (response.rows.length === 25) {
                                    currentPage++;
                                    loadPage(); // Load next page
                                } else {
                                    // We've loaded all data
                                    updateSummaryCards();
                                    displayZinnen();
                                }
                            } else {
                                // No more data
                                updateSummaryCards();
                                displayZinnen();
                            }
                        } else {
                            showError('Error loading zinnen: ' + (response.error || 'Unknown error'));
                        }
                    },
                    error: function(xhr, status, error) {
                        showError('Network error: ' + error);
                    }
                });
            }
            
            loadPage(); // Start loading from page 1
        }
        
        // Update summary card counts
        function updateSummaryCards() {
            const withVideo = allZinnen.filter(zin => zin.video_count > 0);
            const withoutVideo = allZinnen.filter(zin => zin.video_count === 0);
            
            $('#totalCount').text(allZinnen.length);
            $('#withVideoCount').text(withVideo.length);
            $('#withoutVideoCount').text(withoutVideo.length);
            
            $('#withVideoSectionCount').text(withVideo.length);
            $('#withoutVideoSectionCount').text(withoutVideo.length);
        }
        
        // Display zinnen based on current filter
        function displayZinnen() {
            let zinnenToDisplay = [];
            let targetSection = '';
            
            switch(currentFilter) {
                case 'with-video':
                    zinnenToDisplay = allZinnen.filter(zin => zin.video_count > 0);
                    targetSection = 'withVideo';
                    $('#withVideoSection').show();
                    $('#withoutVideoSection').hide();
                    break;
                case 'without-video':
                    zinnenToDisplay = allZinnen.filter(zin => zin.video_count === 0);
                    targetSection = 'withoutVideo';
                    $('#withVideoSection').hide();
                    $('#withoutVideoSection').show();
                    break;
                default:
                    // Show both sections
                    $('#withVideoSection').show();
                    $('#withoutVideoSection').show();
                    displaySection('withVideo', allZinnen.filter(zin => zin.video_count > 0));
                    displaySection('withoutVideo', allZinnen.filter(zin => zin.video_count === 0));
                    return;
            }
            
            displaySection(targetSection, zinnenToDisplay);
        }
        
        // Display a specific section
        function displaySection(section, zinnen) {
            const page = currentPage[section];
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedZinnen = zinnen.slice(start, end);
            
            const contentDiv = $(`#${section}Content`);
            
            if (zinnen.length === 0) {
                contentDiv.html(`
                    <div class="empty-state">
                        <i class="fas fa-${section === 'withVideo' ? 'video' : 'video-slash'}"></i>
                        <h4>Geen zinnen gevonden</h4>
                        <p>Er zijn geen zinnen ${section === 'withVideo' ? 'met' : 'zonder'} video's met de huidige filters.</p>
                    </div>
                `);
                $(`#${section}Pagination`).empty();
                return;
            }
            
            let html = '';
            paginatedZinnen.forEach(zin => {
                html += createZinRow(zin);
            });
            
            contentDiv.html(html);
            createPagination(section, zinnen.length);
        }
        
        // Create HTML for a single zin row
        function createZinRow(zin) {
            const statusBadges = [];
            if (zin.status_video === 'Klaar') statusBadges.push('<span class="badge bg-success status-badge">Video Controle: Klaar</span>');
            if (zin.status_gvg === 'Klaar') statusBadges.push('<span class="badge bg-success status-badge">GvG: Klaar</span>');
            if (zin.status_annotatie === 'Klaar') statusBadges.push('<span class="badge bg-success status-badge">Annotatie: Klaar</span>');
            if (zin.status_glos === 'Klaar') statusBadges.push('<span class="badge bg-success status-badge">Glos: Klaar</span>');
            
            let videoThumbnails = '';
            if (zin.videos && zin.videos.length > 0) {
                zin.videos.forEach(video => {
                    if (video.m_file && typeof video.m_file === 'string') {
                        const thumbnailPath = `https://media.signcollect.nl/${video.m_file.replace('.wav', '.jpg')}`;
                        const videoPath = `https://media.signcollect.nl/${video.m_file}`;
                        videoThumbnails += `<img src="${thumbnailPath}" class="video-thumbnail" data-video="${videoPath}" alt="Video thumbnail">`;
                    }
                });
            }
            
            return `
                <div class="zin-row" data-id="${zin.ID}">
                    <div class="row align-items-center">
                        <div class="col-md-7">
                            <div class="zin-text" id="zin-text-${zin.ID}">
                                ${zin.zinArray || ''}
                                <i class="fas fa-edit edit-icon" data-id="${zin.ID}"></i>
                            </div>
                            <div class="zin-meta">
                                <strong>ID:</strong> ${zin.zinID} | <strong>Thema:</strong> ${zin.thema || 'N/A'}
                                ${zin.video_count > 0 ? ` | <strong>Video's:</strong> ${zin.video_count}` : ''}
                            </div>
                            <div class="mt-1">
                                ${statusBadges.join(' ')}
                            </div>
                        </div>
                        <div class="col-md-3">
                            ${videoThumbnails}
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-sm btn-outline-primary" onclick="openInEditor(${zin.ID})">
                                <i class="fas fa-external-link-alt"></i> Open
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Create pagination
        function createPagination(section, totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const currentPageNum = currentPage[section];
            const paginationDiv = $(`#${section}Pagination`);
            
            if (totalPages <= 1) {
                paginationDiv.empty();
                return;
            }
            
            let html = '<nav><ul class="pagination">';
            
            // Previous button
            html += `<li class="page-item ${currentPageNum === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPageNum - 1}" data-section="${section}">Vorige</a>
                     </li>`;
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPageNum - 2 && i <= currentPageNum + 2)) {
                    html += `<li class="page-item ${i === currentPageNum ? 'active' : ''}">
                                <a class="page-link" href="#" data-page="${i}" data-section="${section}">${i}</a>
                             </li>`;
                } else if (i === currentPageNum - 3 || i === currentPageNum + 3) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
            }
            
            // Next button
            html += `<li class="page-item ${currentPageNum === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPageNum + 1}" data-section="${section}">Volgende</a>
                     </li>`;
            
            html += '</ul></nav>';
            paginationDiv.html(html);
        }
        
        // Attach event handlers
        function attachEventHandlers() {
            // Summary card clicks
            $('.summary-card').on('click', function() {
                $('.summary-card').removeClass('active');
                $(this).addClass('active');
                currentFilter = $(this).data('filter');
                displayZinnen();
            });
            
            // Apply filters button
            $('#applyFilters').on('click', function() {
                loadZinnen();
            });
            
            // Search on enter
            $('#searchInput').on('keypress', function(e) {
                if (e.which === 13) {
                    loadZinnen();
                }
            });
            
            // Pagination clicks
            $(document).on('click', '.pagination a', function(e) {
                e.preventDefault();
                const page = parseInt($(this).data('page'));
                const section = $(this).data('section');
                
                if (!isNaN(page) && page > 0) {
                    currentPage[section] = page;
                    displayZinnen();
                }
            });
            
            // Edit icon clicks
            $(document).on('click', '.edit-icon', function(e) {
                e.stopPropagation();
                const id = $(this).data('id');
                const textDiv = $(`#zin-text-${id}`);
                const currentText = textDiv.text().trim();
                
                textDiv.html(`<input type="text" class="zin-input" id="zin-input-${id}" value="${currentText}">`);
                $(`#zin-input-${id}`).focus().select();
                
                // Save on enter or blur
                $(`#zin-input-${id}`).on('keypress blur', function(e) {
                    if (e.type === 'blur' || e.which === 13) {
                        saveZinText(id, $(this).val());
                    }
                });
            });
            
            // Video thumbnail hover
            $(document).on('mouseenter', '.video-thumbnail', function() {
                const videoPath = $(this).data('video');
                const preview = $('#videoPreview');
                const offset = $(this).offset();
                
                preview.html(`<video src="${videoPath}" autoplay muted loop></video>`);
                preview.css({
                    top: offset.top - 150,
                    left: offset.left + 70
                }).show();
            });
            
            $(document).on('mouseleave', '.video-thumbnail', function() {
                $('#videoPreview').hide();
            });
            
            // Export buttons
            $('.export-btn').on('click', function() {
                const section = $(this).data('section');
                exportData(section);
            });
        }
        
        // Save edited zin text
        function saveZinText(id, newText) {
            $.ajax({
                url: 'getZinnen.php',
                type: 'GET',
                data: {
                    action: 'editZin',
                    rowId: id,
                    zinArray: newText
                },
                success: function(response) {
                    if (response.success) {
                        // Update local data
                        const zin = allZinnen.find(z => z.ID == id);
                        if (zin) {
                            zin.zinArray = newText;
                        }
                        // Update display
                        $(`#zin-text-${id}`).html(`${newText} <i class="fas fa-edit edit-icon" data-id="${id}"></i>`);
                    } else {
                        alert('Error saving text: ' + response.error);
                        displayZinnen(); // Refresh to show original text
                    }
                },
                error: function() {
                    alert('Network error while saving');
                    displayZinnen(); // Refresh to show original text
                }
            });
        }
        
        // Open zin in editor
        function openInEditor(id) {
            window.open(`subBeta3.html?rowId=${id}`, '_blank');
        }
        
        // Export data
        function exportData(section) {
            let dataToExport = [];
            
            if (section === 'with-video') {
                dataToExport = allZinnen.filter(zin => zin.video_count > 0);
            } else {
                dataToExport = allZinnen.filter(zin => zin.video_count === 0);
            }
            
            // Create CSV content
            let csv = 'ID,Zin ID,Text,Thema,Video Count,Status Video,Status GvG,Status Annotatie,Status Glos\\n';

            dataToExport.forEach(zin => {
                csv += `${zin.ID},"${zin.zinID}","${(zin.zinArray || '').replace(/"/g, '""')}","${zin.thema || ''}",${zin.video_count},"${zin.status_video || ''}","${zin.status_gvg || ''}","${zin.status_annotatie || ''}","${zin.status_glos || ''}"\\n`;
            });
            
            // Download CSV
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `zinnen_${section}_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
        
        // Show error message
        function showError(message) {
            console.error(message);
            // Could add a toast notification here
        }
    </script>
</body>
</html>
