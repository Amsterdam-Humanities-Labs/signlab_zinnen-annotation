<!DOCTYPE html>
<html>
<head>
    <title>SSE Test Client</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: scroll;
            background: #f5f5f5;
        }
        .log { margin: 5px 0; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        button { padding: 10px 20px; margin: 10px 5px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>SSE Streaming Test Client</h1>

    <div>
        <label>Filename: <input type="text" id="filename" value="M20241204_0100" size="30"></label>
        <button onclick="testSimpleSSE()">Test Simple SSE</button>
        <button onclick="testRealSegmentation()">Test Real Segmentation</button>
        <button onclick="clearOutput()">Clear</button>
    </div>

    <h3>Output:</h3>
    <div id="output"></div>

    <script>
        function log(message, type = 'info') {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = new Date().toISOString() + ' - ' + message;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
            console.log(message);
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }

        function testSimpleSSE() {
            log('Testing simple SSE stream...', 'info');

            fetch('test_segmentation_sse.php')
                .then(response => {
                    log('Response received: ' + response.status, 'success');

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    function processStream() {
                        reader.read().then(({done, value}) => {
                            if (done) {
                                log('Stream complete', 'success');
                                return;
                            }

                            buffer += decoder.decode(value, {stream: true});
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const jsonStr = line.substring(6);
                                    try {
                                        const data = JSON.parse(jsonStr);
                                        log('Received: ' + JSON.stringify(data), 'success');
                                    } catch (e) {
                                        log('Parse error: ' + e.message, 'error');
                                    }
                                }
                            }

                            processStream();
                        }).catch(err => {
                            log('Stream error: ' + err.message, 'error');
                        });
                    }

                    processStream();
                })
                .catch(err => {
                    log('Fetch error: ' + err.message, 'error');
                });
        }

        function testRealSegmentation() {
            const filename = document.getElementById('filename').value;
            log('Testing real segmentation for: ' + filename, 'info');

            fetch('test_real_segmentation.php')
                .then(response => {
                    log('Response received: ' + response.status, 'success');

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    function processStream() {
                        reader.read().then(({done, value}) => {
                            if (done) {
                                log('Stream complete', 'success');
                                return;
                            }

                            buffer += decoder.decode(value, {stream: true});
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const jsonStr = line.substring(6);
                                    try {
                                        const data = JSON.parse(jsonStr);
                                        log('SSE: ' + data.status + ' - ' + (data.message || data.stage || ''), 'success');
                                        if (data.percentage) {
                                            log('Progress: ' + data.percentage + '%', 'info');
                                        }
                                    } catch (e) {
                                        log('Parse error: ' + e.message, 'error');
                                    }
                                }
                            }

                            processStream();
                        }).catch(err => {
                            log('Stream error: ' + err.message, 'error');
                        });
                    }

                    processStream();
                })
                .catch(err => {
                    log('Fetch error: ' + err.message, 'error');
                });
        }
    </script>
</body>
</html>
