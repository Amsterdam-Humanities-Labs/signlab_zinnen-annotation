<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemma Processing Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-badge { font-size: 0.9em; }
        .processed { background-color: #28a745; }
        .pending { background-color: #ffc107; }
        .error { background-color: #dc3545; }
        .sentence-preview { 
            max-width: 400px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }
        .lemma-list { font-style: italic; color: #666; }
        #progressBar { transition: width 0.3s ease; }
        .stats-card { min-height: 100px; }
        #logOutput {
            background-color: #f8f9fa;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <h1 class="mb-4">Lemma Processing Monitor</h1>
        
        <!-- Statistics Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h5 class="card-title">Total Sentences</h5>
                        <h2 id="totalSentences" class="text-primary">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h5 class="card-title">Processed</h5>
                        <h2 id="processedCount" class="text-success">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h5 class="card-title">Pending</h5>
                        <h2 id="pendingCount" class="text-warning">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h5 class="card-title">Errors</h5>
                        <h2 id="errorCount" class="text-danger">-</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress mb-4" style="height: 25px;">
            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                 role="progressbar" style="width: 0%">
                <span id="progressText">0%</span>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="mb-4">
            <div class="row">
                <div class="col-md-6">
                    <button id="refreshBtn" class="btn btn-primary">
                        <i class="bi bi-arrow-clockwise"></i> Refresh Statistics
                    </button>
                    <button id="processBtn" class="btn btn-success">
                        <i class="bi bi-play-fill"></i> Process ALL Unprocessed Sentences
                    </button>
                    <button id="processSelectedBtn" class="btn btn-warning">
                        <i class="bi bi-play"></i> Process Selected ID
                    </button>
                    <input type="number" id="sentenceId" class="form-control d-inline-block w-auto" 
                           placeholder="Sentence ID" style="width: 150px !important;">
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control" 
                               placeholder="Search by sentence ID or lemma keyword...">
                        <button id="searchBtn" class="btn btn-outline-secondary" type="button">
                            <i class="bi bi-search"></i> Search
                        </button>
                        <button id="clearSearchBtn" class="btn btn-outline-secondary" type="button">
                            <i class="bi bi-x-circle"></i> Clear
                        </button>
                    </div>
                    <small class="text-muted">Examples: "123" for ID or "lopen" for lemma</small>
                </div>
            </div>
        </div>

        <!-- Processing Log -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Processing Log</h5>
            </div>
            <div class="card-body">
                <div id="logOutput" class="p-3 border rounded"></div>
            </div>
        </div>

        <!-- Recent Sentences Table -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Sentences <span id="searchIndicator" class="badge bg-info ms-2" style="display: none;">Searching</span></h5>
                <div>
                    <span id="pageInfo" class="me-3">Page 1 of 1</span>
                    <button id="prevPageBtn" class="btn btn-sm btn-outline-secondary" disabled>
                        <i class="bi bi-chevron-left"></i> Previous
                    </button>
                    <button id="nextPageBtn" class="btn btn-sm btn-outline-secondary">
                        Next <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Sentence</th>
                                <th>Lemmas</th>
                                <th>Status</th>
                                <th>Processed At</th>
                                <th>Error</th>
                            </tr>
                        </thead>
                        <tbody id="sentencesTable">
                            <tr>
                                <td colspan="6" class="text-center">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <div id="recordInfo">Showing 0 records</div>
                    <nav>
                        <ul class="pagination mb-0" id="paginationContainer">
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let isProcessing = false;
        let currentPage = 1;
        let totalPages = 1;
        let searchQuery = '';

        function loadStatistics() {
            $.get('getLemmaStats.php', function(data) {
                if (data.success) {
                    $('#totalSentences').text(data.stats.total);
                    $('#processedCount').text(data.stats.processed);
                    $('#pendingCount').text(data.stats.pending);
                    $('#errorCount').text(data.stats.errors);
                    
                    const progress = (data.stats.processed / data.stats.total * 100).toFixed(1);
                    $('#progressBar').css('width', progress + '%');
                    $('#progressText').text(progress + '%');
                }
            });
        }

        function loadSentences(page = 1) {
            let url = searchQuery ? 
                `searchLemmas.php?query=${encodeURIComponent(searchQuery)}&page=${page}` : 
                `getLemmas.php?page=${page}`;
                
            $.get(url, function(data) {
                if (data.success) {
                    currentPage = data.pagination.current_page;
                    totalPages = data.pagination.total_pages;
                    
                    // Update page info
                    $('#pageInfo').text(`Page ${currentPage} of ${totalPages}`);
                    $('#recordInfo').text(`Showing ${data.pagination.displayed_range} of ${data.pagination.total_sentences} records`);
                    
                    // Update navigation buttons
                    $('#prevPageBtn').prop('disabled', !data.pagination.has_previous);
                    $('#nextPageBtn').prop('disabled', !data.pagination.has_next);
                    
                    // Build pagination
                    buildPagination(currentPage, totalPages);
                    
                    // Build table rows
                    let html = '';
                    data.data.forEach(function(sentence) {
                        const statusClass = sentence.lemmaList.length > 0 ? 'processed' : 'pending';
                        const statusText = sentence.lemmaList.length > 0 ? 'Processed' : 'Pending';
                        
                        // Highlight search term in lemmas if searching
                        let lemmaDisplay = sentence.lemmaList.join(', ') || '-';
                        if (searchQuery && !$.isNumeric(searchQuery)) {
                            const regex = new RegExp(`(${searchQuery})`, 'gi');
                            lemmaDisplay = lemmaDisplay.replace(regex, '<mark>$1</mark>');
                        }
                        
                        html += `<tr>
                            <td>${sentence.id}</td>
                            <td class="sentence-preview">${sentence.zinString}</td>
                            <td class="lemma-list">${lemmaDisplay}</td>
                            <td><span class="badge ${statusClass} status-badge">${statusText}</span></td>
                            <td>${sentence.lemma_processed_at || '-'}</td>
                            <td>${sentence.lemma_error ? '<span class="text-danger">' + sentence.lemma_error + '</span>' : '-'}</td>
                        </tr>`;
                    });
                    
                    if (html === '') {
                        html = '<tr><td colspan="6" class="text-center">No sentences found</td></tr>';
                    }
                    
                    $('#sentencesTable').html(html);
                }
            }).fail(function(xhr) {
                $('#sentencesTable').html('<tr><td colspan="6" class="text-center text-danger">Error loading data</td></tr>');
            });
        }

        function buildPagination(current, total) {
            let html = '';
            
            // Previous button
            html += `<li class="page-item ${current === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" data-page="${current - 1}">Previous</a>
            </li>`;
            
            // Page numbers
            let startPage = Math.max(1, current - 2);
            let endPage = Math.min(total, current + 2);
            
            if (startPage > 1) {
                html += '<li class="page-item"><a class="page-link" href="#" data-page="1">1</a></li>';
                if (startPage > 2) {
                    html += '<li class="page-item disabled"><a class="page-link" href="#">...</a></li>';
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<li class="page-item ${i === current ? 'active' : ''}">
                    <a class="page-link" href="#" data-page="${i}">${i}</a>
                </li>`;
            }
            
            if (endPage < total) {
                if (endPage < total - 1) {
                    html += '<li class="page-item disabled"><a class="page-link" href="#">...</a></li>';
                }
                html += `<li class="page-item"><a class="page-link" href="#" data-page="${total}">${total}</a></li>`;
            }
            
            // Next button
            html += `<li class="page-item ${current === total ? 'disabled' : ''}">
                <a class="page-link" href="#" data-page="${current + 1}">Next</a>
            </li>`;
            
            $('#paginationContainer').html(html);
        }

        function processSentences(sentenceId = null) {
            if (isProcessing) {
                alert('Processing already in progress!');
                return;
            }

            isProcessing = true;
            $('#processBtn').prop('disabled', true).text('Processing...');
            $('#logOutput').empty();

            let url = 'processLemmasWithAI.php'; // No limit = process all
            if (sentenceId) {
                url = `processLemmasWithAI.php?sentence_id=${sentenceId}`;
            }

            // Create EventSource for streaming response
            const source = new EventSource(url);
            
            source.onmessage = function(event) {
                const data = JSON.parse(event.data);
                let logEntry = '';
                
                if (data.status === 'starting') {
                    logEntry = `Starting to process ${data.total_sentences} sentences...\n`;
                } else if (data.processing) {
                    logEntry = `[${data.progress}] Processing: ${data.sentence}\n`;
                } else if (data.success) {
                    logEntry = `✓ Sentence ${data.sentence_id}: ${data.lemma_count} lemmas\n`;
                } else if (data.error) {
                    logEntry = `✗ Error on sentence ${data.sentence_id}: ${data.message}\n`;
                } else if (data.status === 'completed') {
                    logEntry = `\nCompleted! Processed: ${data.statistics.processed}, Errors: ${data.statistics.errors}, Duration: ${data.statistics.duration}s\n`;
                    source.close();
                    isProcessing = false;
                    $('#processBtn').prop('disabled', false).text('Process Unprocessed Sentences');
                    loadStatistics();
                    loadSentences(currentPage);
                }
                
                $('#logOutput').append(logEntry);
                $('#logOutput').scrollTop($('#logOutput')[0].scrollHeight);
            };

            source.onerror = function(error) {
                console.error('EventSource error:', error);
                source.close();
                isProcessing = false;
                $('#processBtn').prop('disabled', false).text('Process Unprocessed Sentences');
            };
        }

        // Event handlers
        $('#refreshBtn').click(function() {
            loadStatistics();
            loadSentences(currentPage);
        });

        $('#processBtn').click(function() {
            if (confirm('Start processing ALL unprocessed sentences? This may take a long time.')) {
                processSentences();
            }
        });

        $('#processSelectedBtn').click(function() {
            const sentenceId = $('#sentenceId').val();
            if (!sentenceId) {
                alert('Please enter a sentence ID');
                return;
            }
            processSentences(sentenceId);
        });
        
        // Navigation button handlers
        $('#prevPageBtn').click(function() {
            if (currentPage > 1) {
                loadSentences(currentPage - 1);
            }
        });
        
        $('#nextPageBtn').click(function() {
            if (currentPage < totalPages) {
                loadSentences(currentPage + 1);
            }
        });
        
        // Pagination link handler
        $(document).on('click', '.pagination a', function(e) {
            e.preventDefault();
            const page = $(this).data('page');
            if (page && !$(this).parent().hasClass('disabled')) {
                loadSentences(page);
            }
        });
        
        // Search functionality
        function performSearch() {
            searchQuery = $('#searchInput').val().trim();
            currentPage = 1;
            
            if (searchQuery) {
                $('#searchIndicator').text(`Searching: "${searchQuery}"`).show();
            } else {
                $('#searchIndicator').hide();
            }
            
            loadSentences(1);
        }
        
        $('#searchBtn').click(performSearch);
        
        $('#searchInput').keypress(function(e) {
            if (e.which === 13) { // Enter key
                performSearch();
            }
        });
        
        $('#clearSearchBtn').click(function() {
            $('#searchInput').val('');
            searchQuery = '';
            currentPage = 1;
            $('#searchIndicator').hide();
            loadSentences(1);
        });

        // Initial load
        $(document).ready(function() {
            loadStatistics();
            loadSentences(1);
            // Auto-refresh statistics every 30 seconds
            setInterval(loadStatistics, 30000);
        });
    </script>
</body>
</html>
