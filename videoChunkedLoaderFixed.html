<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunked Video Loader - Fixed Segmentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .log-panel {
            width: 350px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 20px;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }
        
        .log-content {
            flex: 1;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.4;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 6px;
            border-left: 3px solid #444;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .log-entry.info { border-left-color: #4CAF50; }
        .log-entry.warning { border-left-color: #ffa500; }
        .log-entry.error { border-left-color: #ff4444; }
        .log-entry.success { border-left-color: #00ff00; }
        
        .log-timestamp {
            color: #888;
            font-size: 11px;
        }
        
        .log-message {
            color: #e0e0e0;
            margin-top: 2px;
            word-wrap: break-word;
        }
        
        .container {
            flex: 1;
            max-width: 1200px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .url-input-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .video-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .canvas-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            background: #000;
            border-radius: 4px;
            padding: 10px;
        }
        
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #444;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .info-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            border-left: 3px solid #4CAF50;
        }
        
        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        
        .timeline {
            width: 100%;
            height: 60px;
            background: #1a1a1a;
            border-radius: 4px;
            position: relative;
            margin: 20px 0;
            cursor: pointer;
        }
        
        .timeline-loaded {
            position: absolute;
            height: 100%;
            background: #333;
            border-radius: 4px;
        }
        
        .timeline-position {
            position: absolute;
            width: 2px;
            height: 100%;
            background: #ff0000;
            pointer-events: none;
        }
        
        .load-more-section {
            text-align: center;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .load-more-section.visible {
            display: block;
        }
        
        .speed-btn {
            padding: 5px 10px;
            font-size: 12px;
            background: #333;
        }
        
        .speed-btn.active {
            background: #4CAF50;
        }
        
        select {
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- Log Panel -->
        <div class="log-panel">
            <div class="log-header">
                <div class="log-title">📋 Activity Log</div>
                <div class="log-controls">
                    <button onclick="clearLog()" style="padding: 4px 8px; font-size: 12px;">Clear</button>
                </div>
            </div>
            <div class="log-content" id="logContent"></div>
        </div>
        
        <!-- Main Content -->
        <div class="container">
            <h1>🎬 Chunked Video Loader - Fixed</h1>
            
            <!-- URL Input Section -->
            <div class="url-input-section">
                <div class="input-group">
                    <input type="text" id="videoUrl" placeholder="Enter video URL" />
                    <button id="loadBtn" onclick="loadVideoFromUrl()">Load Video</button>
                </div>
                <div class="input-group">
                    <label>Segment Duration:</label>
                    <select id="segmentDuration">
                        <option value="5">5 seconds</option>
                        <option value="10" selected>10 seconds</option>
                        <option value="15">15 seconds</option>
                    </select>
                </div>
            </div>
            
            <!-- Info Panel -->
            <div class="info-panel">
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Current Segment</div>
                        <div class="info-value" id="currentSegment">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Loaded Frames</div>
                        <div class="info-value" id="loadedFrames">0</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Time</div>
                        <div class="info-value" id="currentTime">0:00 / 0:00</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Memory Usage</div>
                        <div class="info-value" id="memoryUsage">0 MB</div>
                    </div>
                </div>
            </div>
            
            <!-- Video Section -->
            <div class="video-section">
                <div class="canvas-container">
                    <canvas id="videoCanvas"></canvas>
                </div>
                
                <!-- Timeline -->
                <div class="timeline" id="timeline">
                    <div class="timeline-loaded" id="timelineLoaded"></div>
                    <div class="timeline-position" id="timelinePosition"></div>
                </div>
                
                <!-- Controls -->
                <div class="controls">
                    <button id="playBtn" onclick="togglePlayback()">▶️ Play</button>
                    <button onclick="previousFrame()">⏮️ Prev</button>
                    <button onclick="nextFrame()">⏭️ Next</button>
                    <button onclick="setSpeed(0.5)" class="speed-btn">0.5x</button>
                    <button onclick="setSpeed(1)" class="speed-btn active">1x</button>
                    <button onclick="setSpeed(2)" class="speed-btn">2x</button>
                </div>
            </div>
            
            <!-- Load More Section -->
            <div class="load-more-section" id="loadMoreSection">
                <button onclick="loadNextSegment()">Load Next Segment</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        import getVideoFrames from './mod.js';
        
        // Global state
        let allFrames = [];  // Store ALL frames from video
        let currentSegmentFrames = [];  // Current segment being displayed
        let currentFrameIndex = 0;
        let currentSegmentIndex = 0;
        let totalSegments = 0;
        let segmentDurationSeconds = 10;
        let fps = 60;
        let isPlaying = false;
        let playbackSpeed = 1;
        let animationId = null;
        let lastFrameTime = 0;
        let totalVideoDuration = 0;
        let isLoadingVideo = false;
        let videoLoaded = false;
        
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        
        // Make functions global
        window.loadVideoFromUrl = loadVideoFromUrl;
        window.togglePlayback = togglePlayback;
        window.previousFrame = previousFrame;
        window.nextFrame = nextFrame;
        window.setSpeed = setSpeed;
        window.loadNextSegment = loadNextSegment;
        window.clearLog = clearLog;
        
        // Logging
        function addLog(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit'
            });
            
            entry.innerHTML = `
                <div class="log-timestamp">[${timestamp}]</div>
                <div class="log-message">${message}</div>
            `;
            
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('logContent').innerHTML = '';
            addLog('Log cleared', 'info');
        }
        
        // Initialize
        function init() {
            addLog('Video Loader initialized', 'success');
            const urlParams = new URLSearchParams(window.location.search);
            const url = urlParams.get('url');
            if (url) {
                document.getElementById('videoUrl').value = url;
                loadVideoFromUrl();
            }
            
            document.getElementById('timeline').addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percentage = x / rect.width;
                const targetFrame = Math.floor(currentSegmentFrames.length * percentage);
                seekToFrame(targetFrame);
            });
        }
        
        async function loadVideoFromUrl() {
            const url = document.getElementById('videoUrl').value.trim();
            if (!url || isLoadingVideo) return;
            
            isLoadingVideo = true;
            videoLoaded = false;
            allFrames = [];
            currentSegmentFrames = [];
            currentFrameIndex = 0;
            currentSegmentIndex = 0;
            
            segmentDurationSeconds = parseInt(document.getElementById('segmentDuration').value);
            
            addLog(`Loading video: ${url}`, 'info');
            addLog(`Loading ALL frames first (this may take time)...`, 'warning');
            
            document.getElementById('loadBtn').disabled = true;
            
            try {
                // Get video metadata first
                await getVideoMetadata(url);
                
                // Load ALL frames at once
                const startTime = performance.now();
                await getVideoFrames({
                    videoUrl: url,
                    async onFrame(frame) {
                        const img = await createImageBitmap(frame);
                        allFrames.push(img);
                        
                        // Log progress
                        if (allFrames.length % 100 === 0) {
                            addLog(`Loading frames: ${allFrames.length}...`, 'info');
                        }
                        
                        // Setup canvas on first frame
                        if (allFrames.length === 1) {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            addLog(`Canvas: ${img.width}x${img.height}`, 'info');
                        }
                        
                        frame.close();
                    },
                    onConfig(config) {
                        addLog(`Video codec: ${config.codec}`, 'info');
                    },
                    onFinish() {
                        const loadTime = ((performance.now() - startTime) / 1000).toFixed(2);
                        addLog(`Loaded ${allFrames.length} total frames in ${loadTime}s`, 'success');
                        videoLoaded = true;
                        
                        // Calculate segments
                        totalSegments = Math.ceil(allFrames.length / (segmentDurationSeconds * fps));
                        addLog(`Video has ${totalSegments} segments (${segmentDurationSeconds}s each)`, 'info');
                        
                        // Load first segment
                        loadSegmentFromMemory(0);
                    }
                });
                
            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
            } finally {
                isLoadingVideo = false;
                document.getElementById('loadBtn').disabled = false;
            }
        }
        
        function loadSegmentFromMemory(segmentIndex) {
            if (!videoLoaded || segmentIndex >= totalSegments) return;
            
            const startFrame = segmentIndex * segmentDurationSeconds * fps;
            const endFrame = Math.min(startFrame + (segmentDurationSeconds * fps), allFrames.length);
            
            // Extract segment frames
            currentSegmentFrames = allFrames.slice(startFrame, endFrame);
            currentSegmentIndex = segmentIndex;
            currentFrameIndex = 0;
            
            addLog(`Loaded segment ${segmentIndex + 1}/${totalSegments} (frames ${startFrame}-${endFrame})`, 'success');
            
            // Render first frame
            renderFrame(0);
            updateUI();
            
            // Show/hide load more button
            const hasMore = segmentIndex < totalSegments - 1;
            document.getElementById('loadMoreSection').classList.toggle('visible', hasMore);
        }
        
        function loadNextSegment() {
            if (currentSegmentIndex < totalSegments - 1) {
                loadSegmentFromMemory(currentSegmentIndex + 1);
            }
        }
        
        async function getVideoMetadata(url) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    totalVideoDuration = video.duration;
                    addLog(`Duration: ${formatTime(totalVideoDuration)}`, 'info');
                    addLog(`Resolution: ${video.videoWidth}x${video.videoHeight}`, 'info');
                    video.remove();
                    resolve();
                });
                video.addEventListener('error', () => {
                    video.remove();
                    reject(new Error('Failed to load metadata'));
                });
            });
        }
        
        function renderFrame(index) {
            if (index >= 0 && index < currentSegmentFrames.length) {
                ctx.drawImage(currentSegmentFrames[index], 0, 0, canvas.width, canvas.height);
                currentFrameIndex = index;
                updateUI();
            }
        }
        
        function togglePlayback() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
            
            if (isPlaying) {
                addLog(`Playing at ${playbackSpeed}x`, 'info');
                lastFrameTime = performance.now();
                animate();
            } else {
                addLog('Paused', 'info');
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            }
        }
        
        function animate(currentTime) {
            if (!isPlaying) return;
            
            const deltaTime = currentTime - lastFrameTime;
            const frameDuration = 1000 / (fps * playbackSpeed);
            
            if (deltaTime >= frameDuration) {
                if (currentFrameIndex < currentSegmentFrames.length - 1) {
                    renderFrame(currentFrameIndex + 1);
                    lastFrameTime = currentTime;
                } else {
                    isPlaying = false;
                    document.getElementById('playBtn').textContent = '▶️ Play';
                    addLog('End of segment', 'warning');
                }
            }
            
            if (isPlaying) {
                animationId = requestAnimationFrame(animate);
            }
        }
        
        function previousFrame() {
            if (currentFrameIndex > 0) renderFrame(currentFrameIndex - 1);
        }
        
        function nextFrame() {
            if (currentFrameIndex < currentSegmentFrames.length - 1) renderFrame(currentFrameIndex + 1);
        }
        
        function seekToFrame(index) {
            renderFrame(Math.min(Math.max(0, index), currentSegmentFrames.length - 1));
        }
        
        function setSpeed(speed) {
            playbackSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            addLog(`Speed: ${speed}x`, 'info');
        }
        
        function updateUI() {
            // Segment info
            document.getElementById('currentSegment').textContent = 
                `${currentSegmentIndex + 1} / ${totalSegments || '-'}`;
            
            // Frame info
            document.getElementById('loadedFrames').textContent = 
                `${currentFrameIndex + 1} / ${currentSegmentFrames.length}`;
            
            // Time
            const currentTime = (currentSegmentIndex * segmentDurationSeconds) + (currentFrameIndex / fps);
            const segmentTime = currentSegmentFrames.length / fps;
            document.getElementById('currentTime').textContent = 
                `${formatTime(currentTime)} / ${formatTime(segmentTime)}`;
            
            // Memory
            if (allFrames.length > 0) {
                const bytesPerFrame = canvas.width * canvas.height * 4;
                const totalMB = (allFrames.length * bytesPerFrame / 1024 / 1024).toFixed(1);
                const segmentMB = (currentSegmentFrames.length * bytesPerFrame / 1024 / 1024).toFixed(1);
                document.getElementById('memoryUsage').textContent = 
                    `${segmentMB} MB (Total: ${totalMB} MB)`;
            }
            
            // Timeline
            if (currentSegmentFrames.length > 0) {
                const percentage = (currentFrameIndex / currentSegmentFrames.length) * 100;
                document.getElementById('timelinePosition').style.left = `${percentage}%`;
            }
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        init();
    </script>
</body>
</html>
