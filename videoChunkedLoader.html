<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunked Video Loader - Memory Optimized</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .log-panel {
            width: 350px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 20px;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }
        
        .log-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        
        .log-controls {
            display: flex;
            gap: 5px;
        }
        
        .log-btn {
            padding: 4px 8px;
            font-size: 12px;
            background: #333;
            border: 1px solid #555;
        }
        
        .log-btn:hover {
            background: #444;
        }
        
        .log-content {
            flex: 1;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.4;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 6px;
            border-left: 3px solid #444;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .log-entry.info {
            border-left-color: #4CAF50;
        }
        
        .log-entry.warning {
            border-left-color: #ffa500;
        }
        
        .log-entry.error {
            border-left-color: #ff4444;
        }
        
        .log-entry.success {
            border-left-color: #00ff00;
        }
        
        .log-timestamp {
            color: #888;
            font-size: 11px;
        }
        
        .log-message {
            color: #e0e0e0;
            margin-top: 2px;
            word-wrap: break-word;
        }
        
        .container {
            flex: 1;
            max-width: 1200px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .url-input-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .video-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .canvas-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            background: #000;
            border-radius: 4px;
            padding: 10px;
        }
        
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #444;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .info-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            border-left: 3px solid #4CAF50;
        }
        
        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }
        
        .timeline {
            width: 100%;
            height: 60px;
            background: #1a1a1a;
            border-radius: 4px;
            position: relative;
            margin: 20px 0;
            cursor: pointer;
        }
        
        .timeline-loaded {
            position: absolute;
            height: 100%;
            background: #333;
            border-radius: 4px;
        }
        
        .timeline-position {
            position: absolute;
            width: 2px;
            height: 100%;
            background: #ff0000;
            pointer-events: none;
        }
        
        .segment-indicator {
            position: absolute;
            height: 100%;
            border-right: 1px dashed #666;
        }
        
        .load-more-section {
            text-align: center;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .load-more-section.visible {
            display: block;
        }
        
        .warning {
            color: #ffa500;
            margin-bottom: 10px;
        }
        
        .speed-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        
        .speed-btn {
            padding: 5px 10px;
            font-size: 12px;
            background: #333;
        }
        
        .speed-btn.active {
            background: #4CAF50;
        }
        
        select {
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        .error {
            background: #ff4444;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- Log Panel -->
        <div class="log-panel">
            <div class="log-header">
                <div class="log-title">📋 Activity Log</div>
                <div class="log-controls">
                    <button class="log-btn" onclick="clearLog()">Clear</button>
                    <button class="log-btn" onclick="toggleAutoScroll()">Auto-scroll: ON</button>
                </div>
            </div>
            <div class="log-content" id="logContent"></div>
        </div>
        
        <!-- Main Content -->
        <div class="container">
            <h1>🎬 Chunked Video Loader - Memory Optimized</h1>
        
        <!-- URL Input Section -->
        <div class="url-input-section">
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="Enter video URL (e.g., https://example.com/video.mp4)" />
                <button id="loadBtn" onclick="loadVideoFromUrl()">Load Video</button>
            </div>
            <div class="input-group">
                <label style="margin-right: 10px;">Segment Duration:</label>
                <select id="segmentDuration">
                    <option value="5">5 seconds</option>
                    <option value="10" selected>10 seconds</option>
                    <option value="15">15 seconds</option>
                    <option value="20">20 seconds</option>
                    <option value="30">30 seconds</option>
                </select>
                <label style="margin-left: 20px; margin-right: 10px;">Max Segments in Memory:</label>
                <select id="maxSegments">
                    <option value="1">1 segment</option>
                    <option value="2" selected>2 segments</option>
                    <option value="3">3 segments</option>
                </select>
            </div>
        </div>
        
        <!-- Info Panel -->
        <div class="info-panel">
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Current Segment</div>
                    <div class="info-value" id="currentSegment">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Loaded Frames</div>
                    <div class="info-value" id="loadedFrames">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Current Frame</div>
                    <div class="info-value" id="currentFrame">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Time</div>
                    <div class="info-value" id="currentTimeDisplay">0:00 / 0:00</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Memory Usage</div>
                    <div class="info-value" id="memoryUsage">0 MB</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Video Duration</div>
                    <div class="info-value" id="totalDuration">-</div>
                </div>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="loadProgress" style="width: 0%">
                    <span id="loadProgressText">0%</span>
                </div>
            </div>
        </div>
        
        <!-- Video Section -->
        <div class="video-section">
            <div class="canvas-container">
                <canvas id="videoCanvas"></canvas>
            </div>
            
            <!-- Timeline -->
            <div class="timeline" id="timeline">
                <div class="timeline-loaded" id="timelineLoaded"></div>
                <div class="timeline-position" id="timelinePosition"></div>
            </div>
            
            <!-- Controls -->
            <div class="controls">
                <button id="playBtn" onclick="togglePlayback()">▶️ Play</button>
                <button onclick="previousFrame()">⏮️ Previous Frame</button>
                <button onclick="nextFrame()">⏭️ Next Frame</button>
                <button onclick="jumpToStart()">⏪ Start</button>
                <button onclick="jumpToEnd()">⏩ End</button>
                
                <div class="speed-controls">
                    <label style="margin-right: 10px;">Speed:</label>
                    <button class="speed-btn" data-speed="0.25" onclick="setSpeed(0.25)">0.25x</button>
                    <button class="speed-btn" data-speed="0.5" onclick="setSpeed(0.5)">0.5x</button>
                    <button class="speed-btn active" data-speed="1" onclick="setSpeed(1)">1x</button>
                    <button class="speed-btn" data-speed="1.5" onclick="setSpeed(1.5)">1.5x</button>
                    <button class="speed-btn" data-speed="2" onclick="setSpeed(2)">2x</button>
                </div>
            </div>
        </div>
        
        <!-- Load More Section -->
        <div class="load-more-section" id="loadMoreSection">
            <div class="warning">⚠️ Approaching end of loaded segment!</div>
            <button id="loadNextBtn" onclick="loadNextSegment()">Load Next 10 Seconds</button>
            <div style="margin-top: 10px; font-size: 12px; color: #888;">
                <span id="nextSegmentInfo"></span>
            </div>
        </div>
        
        <!-- Error Display -->
        <div id="errorDisplay"></div>
        </div>
    </div>
    
    <script type="module">
        import getVideoFrames from './mod.js';
        
        // Global variables
        let frames = [];
        let currentFrameIndex = 0;
        let fps = 60;
        let isPlaying = false;
        let playbackSpeed = 1;
        let animationId = null;
        let lastFrameTime = 0;
        
        // Segment management
        let currentSegmentIndex = 0;
        let totalSegments = 0;
        let segmentDurationSeconds = 10;
        let maxSegmentsInMemory = 2;
        let loadedSegments = [];
        let totalVideoDuration = 0;
        let videoUrl = null;
        let isLoadingSegment = false;
        
        // Log management
        let autoScroll = true;
        let logEntryCount = 0;
        
        // Canvas setup
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        
        // Make functions global for onclick handlers
        window.loadVideoFromUrl = loadVideoFromUrl;
        window.togglePlayback = togglePlayback;
        window.previousFrame = previousFrame;
        window.nextFrame = nextFrame;
        window.jumpToStart = jumpToStart;
        window.jumpToEnd = jumpToEnd;
        window.setSpeed = setSpeed;
        window.loadNextSegment = loadNextSegment;
        window.clearLog = clearLog;
        window.toggleAutoScroll = toggleAutoScroll;
        
        // Logging functions
        function addLog(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                fractionalSecondDigits: 3
            });
            
            entry.innerHTML = `
                <div class="log-timestamp">[${timestamp}]</div>
                <div class="log-message">${message}</div>
            `;
            
            logContent.appendChild(entry);
            logEntryCount++;
            
            // Limit log entries to prevent memory issues
            if (logEntryCount > 500) {
                logContent.removeChild(logContent.firstChild);
                logEntryCount--;
            }
            
            // Auto scroll if enabled
            if (autoScroll) {
                logContent.scrollTop = logContent.scrollHeight;
            }
        }
        
        function clearLog() {
            document.getElementById('logContent').innerHTML = '';
            logEntryCount = 0;
            addLog('Log cleared', 'info');
        }
        
        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            const btn = document.querySelector('.log-btn[onclick="toggleAutoScroll()"]');
            btn.textContent = `Auto-scroll: ${autoScroll ? 'ON' : 'OFF'}`;
            addLog(`Auto-scroll ${autoScroll ? 'enabled' : 'disabled'}`, 'info');
        }
        
        // Initialize
        function init() {
            addLog('Video Chunked Loader initialized', 'success');
            addLog(`Default settings: ${segmentDurationSeconds}s segments, max ${maxSegmentsInMemory} in memory`, 'info');
            
            // Check for URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const urlFromParam = urlParams.get('url');
            if (urlFromParam) {
                document.getElementById('videoUrl').value = urlFromParam;
                addLog(`URL parameter detected: ${urlFromParam}`, 'info');
                loadVideoFromUrl();
            }
            
            // Timeline click handler
            document.getElementById('timeline').addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percentage = x / rect.width;
                const targetFrame = Math.floor(frames.length * percentage);
                addLog(`Timeline seek to frame ${targetFrame}`, 'info');
                seekToFrame(targetFrame);
            });
        }
        
        async function loadVideoFromUrl() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            if (!urlInput) {
                showError('Please enter a video URL');
                return;
            }
            
            videoUrl = urlInput;
            segmentDurationSeconds = parseInt(document.getElementById('segmentDuration').value);
            maxSegmentsInMemory = parseInt(document.getElementById('maxSegments').value);
            
            addLog(`Loading video: ${urlInput}`, 'info');
            addLog(`Settings: ${segmentDurationSeconds}s segments, max ${maxSegmentsInMemory} in memory`, 'info');
            
            // Reset state
            frames = [];
            currentFrameIndex = 0;
            currentSegmentIndex = 0;
            loadedSegments = [];
            isPlaying = false;
            
            updateUI();
            
            try {
                // First, get video metadata to determine total duration
                addLog('Fetching video metadata...', 'info');
                await getVideoMetadata(videoUrl);
                
                // Load first segment
                addLog(`Starting to load segment 1/${totalSegments}`, 'info');
                await loadSegment(0);
                
            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
                showError(`Failed to load video: ${error.message}`);
            }
        }
        
        async function getVideoMetadata(url) {
            // Create a temporary video element to get duration
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    totalVideoDuration = video.duration;
                    totalSegments = Math.ceil(totalVideoDuration / segmentDurationSeconds);
                    document.getElementById('totalDuration').textContent = formatTime(totalVideoDuration);
                    
                    addLog(`Video metadata loaded:`, 'success');
                    addLog(`Duration: ${formatTime(totalVideoDuration)}`, 'info');
                    addLog(`Resolution: ${video.videoWidth}x${video.videoHeight}`, 'info');
                    addLog(`Total segments: ${totalSegments} (${segmentDurationSeconds}s each)`, 'info');
                    
                    video.remove();
                    resolve();
                });
                video.addEventListener('error', () => {
                    addLog('Failed to load video metadata', 'error');
                    reject(new Error('Failed to load video metadata'));
                });
            });
        }
        
        async function loadSegment(segmentIndex) {
            if (isLoadingSegment) return;
            isLoadingSegment = true;
            
            const startTime = segmentIndex * segmentDurationSeconds;
            const endTime = Math.min(startTime + segmentDurationSeconds, totalVideoDuration);
            const segmentFrames = [];
            
            addLog(`Loading segment ${segmentIndex + 1}/${totalSegments}`, 'info');
            addLog(`Time range: ${formatTime(startTime)} - ${formatTime(endTime)}`, 'info');
            
            document.getElementById('loadBtn').disabled = true;
            document.getElementById('loadNextBtn').disabled = true;
            
            let frameLoadStartTime = performance.now();
            
            try {
                const targetFrames = segmentDurationSeconds * fps;
                addLog(`Target frames for segment: ${targetFrames}`, 'info');
                
                let framesLoaded = 0;
                
                await getVideoFrames({
                    videoUrl: videoUrl,
                    async onFrame(frame) {
                        // Stop loading after target frames
                        if (framesLoaded >= targetFrames) {
                            frame.close();
                            return;
                        }
                        
                        const img = await createImageBitmap(frame);
                        segmentFrames.push(img);
                        framesLoaded++;
                        
                        // Update progress
                        const progress = (segmentFrames.length / targetFrames) * 100;
                        updateLoadProgress(segmentIndex, progress);
                        
                        // Log every 100th frame
                        if (segmentFrames.length % 100 === 0) {
                            addLog(`Loaded ${segmentFrames.length}/${targetFrames} frames...`, 'info');
                        }
                        
                        // Set canvas dimensions on first frame
                        if (frames.length === 0 && segmentFrames.length === 1) {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            addLog(`Canvas set to ${img.width}x${img.height}`, 'info');
                            renderFrame(0);
                        }
                        
                        frame.close();
                    },
                    onConfig(config) {
                        addLog(`Video codec: ${config.codec}`, 'info');
                        console.log('Video config:', config);
                    },
                    onFinish() {
                        const loadTime = ((performance.now() - frameLoadStartTime) / 1000).toFixed(2);
                        addLog(`Segment ${segmentIndex + 1} complete: ${segmentFrames.length} frames in ${loadTime}s`, 'success');
                    }
                });
                
                // Add segment to loaded segments
                loadedSegments.push({
                    index: segmentIndex,
                    frames: segmentFrames,
                    startFrame: frames.length,
                    endFrame: frames.length + segmentFrames.length - 1
                });
                
                // Append frames to main array
                const previousFrameCount = frames.length;
                frames.push(...segmentFrames);
                addLog(`Total frames in memory: ${frames.length}`, 'info');
                
                // Clean up old segments if needed
                cleanupOldSegments();
                
                updateUI();
                
            } catch (error) {
                addLog(`Failed to load segment ${segmentIndex + 1}: ${error.message}`, 'error');
                showError(`Failed to load segment ${segmentIndex + 1}: ${error.message}`);
            } finally {
                isLoadingSegment = false;
                document.getElementById('loadBtn').disabled = false;
                document.getElementById('loadNextBtn').disabled = false;
            }
        }
        
        async function loadNextSegment() {
            const nextSegmentIndex = Math.floor(frames.length / (segmentDurationSeconds * fps));
            if (nextSegmentIndex < totalSegments) {
                addLog(`User requested next segment (${nextSegmentIndex + 1}/${totalSegments})`, 'info');
                await loadSegment(nextSegmentIndex);
            } else {
                addLog('No more segments to load', 'warning');
            }
        }
        
        function cleanupOldSegments() {
            // After loading the 3rd segment, start removing old segments to keep memory usage low
            if (loadedSegments.length >= 3) {
                // Remove the first (oldest) segment
                const removedSegment = loadedSegments.shift();
                
                // Remove frames from the beginning
                const framesToRemove = removedSegment.frames.length;
                frames.splice(0, framesToRemove);
                
                // Adjust current frame index
                currentFrameIndex = Math.max(0, currentFrameIndex - framesToRemove);
                
                // Update segment indices in remaining segments
                loadedSegments.forEach(seg => {
                    seg.startFrame -= framesToRemove;
                    seg.endFrame -= framesToRemove;
                });
                
                addLog(`Memory cleanup: Removed segment ${removedSegment.index + 1} (${framesToRemove} frames)`, 'warning');
                addLog(`Active segments: ${loadedSegments.map(s => s.index + 1).join(', ')}`, 'info');
                addLog(`Memory freed: ~${(framesToRemove * canvas.width * canvas.height * 4 / 1024 / 1024).toFixed(1)} MB`, 'success');
            }
        }
        
        function renderFrame(index) {
            if (index >= 0 && index < frames.length) {
                ctx.drawImage(frames[index], 0, 0, canvas.width, canvas.height);
                currentFrameIndex = index;
                updateUI();
                checkLoadMoreButton();
            }
        }
        
        function checkLoadMoreButton() {
            const framesPerSegment = segmentDurationSeconds * fps;
            const currentSegment = Math.floor(currentFrameIndex / framesPerSegment);
            const segmentProgress = (currentFrameIndex % framesPerSegment) / framesPerSegment;
            
            // Auto-load when 70% through current segment (3 seconds before end at 10s segments)
            const autoLoadThreshold = 0.7; // 70% = 7 seconds into 10-second segment
            const shouldAutoLoad = segmentProgress > autoLoadThreshold && 
                                  (currentSegment + 1) * framesPerSegment >= frames.length &&
                                  frames.length < totalVideoDuration * fps;
            
            if (shouldAutoLoad && !isLoadingSegment) {
                const nextSegmentIndex = Math.floor(frames.length / framesPerSegment);
                addLog(`Auto-loading next segment at ${(segmentProgress * 100).toFixed(1)}% through current segment`, 'info');
                loadNextSegment();
            }
            
            // Show manual load button when 90% through current segment (as backup)
            const shouldShowButton = segmentProgress > 0.9 && 
                                    (currentSegment + 1) * framesPerSegment >= frames.length &&
                                    frames.length < totalVideoDuration * fps;
            
            const loadMoreSection = document.getElementById('loadMoreSection');
            if (shouldShowButton) {
                loadMoreSection.classList.add('visible');
                const nextSegmentIndex = Math.floor(frames.length / framesPerSegment);
                document.getElementById('nextSegmentInfo').textContent = 
                    `Next segment: ${nextSegmentIndex + 1} of ${totalSegments}`;
            } else {
                loadMoreSection.classList.remove('visible');
            }
        }
        
        function togglePlayback() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
            
            if (isPlaying) {
                addLog(`Playback started at ${playbackSpeed}x speed`, 'info');
                lastFrameTime = performance.now();
                animate();
            } else {
                addLog('Playback paused', 'info');
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            }
        }
        
        function animate(currentTime) {
            if (!isPlaying) return;
            
            const deltaTime = currentTime - lastFrameTime;
            const frameDuration = 1000 / (fps * playbackSpeed);
            
            if (deltaTime >= frameDuration) {
                if (currentFrameIndex < frames.length - 1) {
                    renderFrame(currentFrameIndex + 1);
                    lastFrameTime = currentTime;
                } else {
                    // End of loaded frames
                    addLog('Reached end of loaded frames', 'warning');
                    isPlaying = false;
                    document.getElementById('playBtn').textContent = '▶️ Play';
                }
            }
            
            if (isPlaying) {
                animationId = requestAnimationFrame(animate);
            }
        }
        
        function previousFrame() {
            if (currentFrameIndex > 0) {
                renderFrame(currentFrameIndex - 1);
            }
        }
        
        function nextFrame() {
            if (currentFrameIndex < frames.length - 1) {
                renderFrame(currentFrameIndex + 1);
            }
        }
        
        function jumpToStart() {
            renderFrame(0);
        }
        
        function jumpToEnd() {
            renderFrame(frames.length - 1);
        }
        
        function seekToFrame(index) {
            renderFrame(Math.min(Math.max(0, index), frames.length - 1));
        }
        
        function setSpeed(speed) {
            playbackSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.speed) === speed);
            });
            addLog(`Playback speed set to ${speed}x`, 'info');
        }
        
        function updateUI() {
            // Current segment
            const framesPerSegment = segmentDurationSeconds * fps;
            const currentSegment = Math.floor(currentFrameIndex / framesPerSegment) + 1;
            document.getElementById('currentSegment').textContent = 
                `${currentSegment} of ${totalSegments || '?'}`;
            
            // Frame info
            document.getElementById('loadedFrames').textContent = frames.length;
            document.getElementById('currentFrame').textContent = `${currentFrameIndex + 1} / ${frames.length}`;
            
            // Time display
            const currentTime = currentFrameIndex / fps;
            const loadedTime = frames.length / fps;
            document.getElementById('currentTimeDisplay').textContent = 
                `${formatTime(currentTime)} / ${formatTime(loadedTime)}`;
            
            // Memory usage estimate (rough approximation)
            // ImageBitmap stores uncompressed pixel data
            // Each frame is stored as an ImageBitmap object
            if (frames.length > 0 && frames[0]) {
                // Get actual dimensions from first frame
                const frameWidth = frames[0].width || 1920; // fallback to HD
                const frameHeight = frames[0].height || 1080;
                const bytesPerPixel = 4; // RGBA
                const bytesPerFrame = frameWidth * frameHeight * bytesPerPixel;
                const totalBytes = frames.length * bytesPerFrame;
                const memoryMB = (totalBytes / 1024 / 1024).toFixed(1);
                document.getElementById('memoryUsage').textContent = `~${memoryMB} MB`;
                
                // Add warning if memory usage is high
                if (totalBytes > 500 * 1024 * 1024) { // > 500MB
                    document.getElementById('memoryUsage').style.color = '#ffa500';
                } else {
                    document.getElementById('memoryUsage').style.color = '#fff';
                }
            } else {
                document.getElementById('memoryUsage').textContent = '0 MB';
            }
            
            // Timeline
            if (frames.length > 0) {
                const loadedPercentage = (frames.length / (totalVideoDuration * fps)) * 100;
                document.getElementById('timelineLoaded').style.width = `${loadedPercentage}%`;
                
                const positionPercentage = (currentFrameIndex / frames.length) * loadedPercentage;
                document.getElementById('timelinePosition').style.left = `${positionPercentage}%`;
            }
        }
        
        function updateLoadProgress(segmentIndex, progress) {
            const overallProgress = ((segmentIndex + progress / 100) / totalSegments) * 100;
            document.getElementById('loadProgress').style.width = `${overallProgress}%`;
            document.getElementById('loadProgressText').textContent = `${Math.round(overallProgress)}%`;
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function showError(message) {
            const errorDisplay = document.getElementById('errorDisplay');
            errorDisplay.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => {
                errorDisplay.innerHTML = '';
            }, 5000);
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
