<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/userProtect.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Add Sentences</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
        }
        .result-message {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Batch Add Sentences</h2>
        <form id="batchAddForm">
            <div class="mb-3">
                <label for="sentencesTextarea" class="form-label">Enter Sentences (one per line)</label>
                <textarea id="sentencesTextarea" class="form-control" placeholder="Enter sentences here, one per line..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        <div id="resultMessage" class="alert alert-success result-message"></div>
        
        <!-- New Video Player Section -->
        <h3>Video Preview</h3>
        <div id="videoContainer">
            <video id="videoPlayer" controls width="100%">
                <!-- Video source will be loaded dynamically -->
            </video>
        </div>
        
        <!-- New Subtitle Viewer Section -->
        <h3>Subtitle Viewer</h3>
        <div id="subtitleViewer">
            <!-- Dynamic subtitle layers will be inserted here -->
        </div>
    </div>

    <script>
        // Helper to get query parameter
        function getQueryParam(param) {
            const params = new URLSearchParams(window.location.search);
            return params.get(param);
        }
        
        // Load video from filename URL param and change .wav to .mp4 if needed
        function loadVideo(){
            const filename = getQueryParam('filename');
            if(!filename) return;
            // Replace .wav with .mp4 (if present)
            const videoFilename = filename.replace(/\.wav$/i, '.mp4');
            const videoUrl = "https://leffe.science.uva.nl:8043/gebarenoverleg_media/studioFilesMini/post/" + videoFilename;
            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.src = videoUrl;
        }
        
        // Load subtitles on page load if filename is provided
        function loadSubtitles(){
            const filename = getQueryParam('filename');
            if(!filename) return;
            fetch('getZinnen.php?action=fetchSubtitles&filename=' + encodeURIComponent(filename))
            .then(response => response.json())
            .then(data => {
                if(data.success){
                    const viewer = document.getElementById('subtitleViewer');
                    viewer.innerHTML = '';
                    // Process each tier
                    for(const tier in data.subtitles){
                        const layerDiv = document.createElement('div');
                        layerDiv.innerHTML = `<h4>${tier}</h4>`;
                        // Build the list of subtitle elements for this tier
                        data.subtitles[tier].forEach((line, index) => {
                            // Create container for each subtitle element with a slider for time adjustment
                            const itemDiv = document.createElement('div');
                            itemDiv.style.marginBottom = '10px';
                            itemDiv.innerHTML = `
                                <div>
                                    <strong>Subtitle ${index+1}:</strong> ${line}
                                </div>
                                <div>
                                    <label>Start/Stop Adjustment: </label>
                                    <input type="range" min="-5000" max="5000" value="0" data-index="${index}" data-tier="${tier}"
                                    onchange="updateTime(this)" style="width:200px;">
                                    <span id="adjust_${tier}_${index}">0 ms</span>
                                </div>
                                <hr>
                            `;
                            layerDiv.appendChild(itemDiv);
                        });
                        viewer.appendChild(layerDiv);
                    }
                } else {
                    console.error(data.error);
                }
            })
            .catch(err => console.error(err));
        }
        
        // Update the display for slider changes
        function updateTime(slider){
            const value = slider.value;
            const tier = slider.getAttribute('data-tier');
            const index = slider.getAttribute('data-index');
            document.getElementById(`adjust_${tier}_${index}`).innerText = value + " ms";
        }
        
        // Existing form submission event listener remains unchanged
        document.getElementById('batchAddForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const sentencesTextarea = document.getElementById('sentencesTextarea');
            const sentences = sentencesTextarea.value.trim().split('\n').filter(sentence => sentence.trim() !== '');
            const resultMessage = document.getElementById('resultMessage');
            if (sentences.length === 0) {
                resultMessage.innerText = 'Please enter at least one sentence.';
                resultMessage.className = 'alert alert-danger result-message';
                resultMessage.style.display = 'block';
                return;
            }
            fetch('getRows.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: JSON.stringify({ sentences })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resultMessage.innerText = `Sentences added successfully! Inserted: ${data.inserted}, Failed: ${data.failed}`;
                    resultMessage.className = 'alert alert-success result-message';
                    sentencesTextarea.value = '';
                } else {
                    resultMessage.innerText = 'Failed to add sentences. Error: ' + (data.error || data.errors.join('; '));
                    resultMessage.className = 'alert alert-danger result-message';
                }
                resultMessage.style.display = 'block';
            })
            .catch(error => {
                resultMessage.innerText = 'Failed to add sentences. Error: ' + error.message;
                resultMessage.className = 'alert alert-danger result-message';
                resultMessage.style.display = 'block';
            });
        });

        // Call both loadVideo and loadSubtitles if filename is present in URL
        window.addEventListener('load', function(){
            loadVideo();
            loadSubtitles();
        });
    </script>
</body>
</html>
