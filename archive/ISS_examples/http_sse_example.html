<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS Server - HTTP + SSE Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 400px;
            padding: 5px;
        }
        button {
            background: #2196F3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #0b7dda;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-fill {
            height: 100%;
            background: #2196F3;
            transition: width 0.3s;
            text-align: center;
            line-height: 30px;
            color: white;
            font-weight: bold;
        }
        .log {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 5px;
        }
        .log-entry {
            padding: 2px 0;
        }
        .log-info { color: #4FC3F7; }
        .log-success { color: #66BB6A; }
        .log-warning { color: #FFA726; }
        .log-error { color: #EF5350; }
        .result-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }
        .result-box h3 {
            margin-top: 0;
            color: #2196F3;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 10px 15px;
            margin-bottom: 20px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>📡 ISS Server - HTTP + SSE Client</h1>

    <div class="info-box">
        <strong>How it works:</strong> First submits an inference request via HTTP POST,
        then monitors progress using Server-Sent Events (SSE).
    </div>

    <div class="form-group">
        <label>Base URL:</label>
        <input type="text" id="baseUrl" value="http://localhost:9102">
    </div>

    <div class="form-group">
        <label>HaMeR Path:</label>
        <input type="text" id="hamerPath" value="/path/to/file.hamer">
    </div>

    <div class="form-group">
        <label>FPS:</label>
        <input type="number" id="fps" value="60" min="1" max="120">
    </div>

    <button id="submitBtn" onclick="startInference()">Submit Inference Request</button>

    <div class="progress-bar" style="display: none;" id="progressContainer">
        <div class="progress-fill" id="progressBar" style="width: 0%">0%</div>
    </div>

    <div class="result-box" id="resultBox">
        <h3>✓ Result Received</h3>
        <div id="resultContent"></div>
    </div>

    <h3>Log:</h3>
    <div class="log" id="log"></div>

    <script>
        let eventSource = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateProgress(percentage) {
            const container = document.getElementById('progressContainer');
            const bar = document.getElementById('progressBar');
            container.style.display = 'block';
            bar.style.width = percentage + '%';
            bar.textContent = Math.round(percentage) + '%';
        }

        function displayResult(data) {
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');

            const metadata = data.metadata || {};
            let html = '<div>';

            if (metadata.segments_detected !== undefined) {
                html += `<p><strong>Segments Detected:</strong> ${metadata.segments_detected}</p>`;
            }
            if (metadata.total_frames !== undefined) {
                html += `<p><strong>Total Frames:</strong> ${metadata.total_frames}</p>`;
            }
            if (metadata.duration_seconds !== undefined) {
                html += `<p><strong>Duration:</strong> ${metadata.duration_seconds}s</p>`;
            }
            if (metadata.processing_time !== undefined) {
                html += `<p><strong>Processing Time:</strong> ${metadata.processing_time}s</p>`;
            }
            if (metadata.fps !== undefined) {
                html += `<p><strong>FPS:</strong> ${metadata.fps}</p>`;
            }

            if (data.srt_content) {
                const preview = data.srt_content.substring(0, 500);
                html += '<h4>SRT Content (first 500 chars):</h4>';
                html += `<pre>${preview}${data.srt_content.length > 500 ? '\n... (truncated)' : ''}</pre>`;
            }

            html += '</div>';
            resultContent.innerHTML = html;
            resultBox.style.display = 'block';
        }

        function setButtonState(disabled, text) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = disabled;
            btn.textContent = text;
        }

        async function submitRequest(baseUrl, hamerPath, fps) {
            const url = `${baseUrl}/inference`;
            log(`Submitting POST request to ${url}...`, 'info');

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    hamer_path: hamerPath,
                    fps: fps
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            log(`✓ Request submitted successfully`, 'success');
            log(`Request ID: ${data.request_id}`, 'info');

            if (data.progress_url) {
                log(`Progress URL: ${data.progress_url}`, 'info');
            }

            return data.request_id;
        }

        function monitorProgress(baseUrl, requestId) {
            return new Promise((resolve, reject) => {
                const url = `${baseUrl}/progress/${requestId}`;
                log(`Connecting to SSE stream: ${url}`, 'info');

                eventSource = new EventSource(url);

                eventSource.addEventListener('ack', (event) => {
                    const data = JSON.parse(event.data);
                    log(`✓ ${data.message}`, 'success');
                    updateProgress(0);
                });

                eventSource.addEventListener('progress', (event) => {
                    const data = JSON.parse(event.data);
                    const stage = data.stage || 'unknown';
                    const percentage = data.percentage || 0;
                    const msg = data.message || '';
                    log(`⟳ ${stage} (${percentage}%) ${msg}`, 'warning');
                    updateProgress(percentage);
                });

                eventSource.addEventListener('result', (event) => {
                    const data = JSON.parse(event.data);
                    log('✓ Result received successfully!', 'success');
                    updateProgress(100);
                    displayResult(data);
                    eventSource.close();
                    resolve(data);
                });

                eventSource.addEventListener('error', (event) => {
                    const data = JSON.parse(event.data);
                    log(`✗ Error: ${data.message}`, 'error');
                    if (data.error_code) {
                        log(`Error code: ${data.error_code}`, 'error');
                    }
                    eventSource.close();
                    reject(new Error(data.message));
                });

                eventSource.addEventListener('done', (event) => {
                    log('Stream completed', 'info');
                    eventSource.close();
                });

                eventSource.onerror = (error) => {
                    log('✗ SSE connection error', 'error');
                    console.error('SSE error:', error);
                    eventSource.close();
                    reject(error);
                };
            });
        }

        async function startInference() {
            const baseUrl = document.getElementById('baseUrl').value;
            const hamerPath = document.getElementById('hamerPath').value;
            const fps = parseInt(document.getElementById('fps').value);

            if (!hamerPath) {
                log('Please enter a HaMeR path', 'error');
                return;
            }

            // Clear previous results
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('log').innerHTML = '';

            setButtonState(true, 'Submitting...');

            try {
                // Step 1: Submit request
                const requestId = await submitRequest(baseUrl, hamerPath, fps);

                setButtonState(true, 'Monitoring Progress...');

                // Step 2: Monitor progress via SSE
                await monitorProgress(baseUrl, requestId);

                setButtonState(false, 'Submit Inference Request');

            } catch (error) {
                log(`✗ Error: ${error.message}`, 'error');
                setButtonState(false, 'Submit Inference Request');
            }
        }

        // Close EventSource on page unload
        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
