<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS Server - WebSocket Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 400px;
            padding: 5px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-fill {
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
            text-align: center;
            line-height: 30px;
            color: white;
            font-weight: bold;
        }
        .log {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 5px;
        }
        .log-entry {
            padding: 2px 0;
        }
        .log-info { color: #4FC3F7; }
        .log-success { color: #66BB6A; }
        .log-warning { color: #FFA726; }
        .log-error { color: #EF5350; }
        .result-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }
        .result-box h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔌 ISS Server - WebSocket Client</h1>
    <p>This example demonstrates real-time communication with the ISS Server using WebSocket.</p>

    <div class="form-group">
        <label>WebSocket URL:</label>
        <input type="text" id="wsUrl" value="ws://localhost:9102/ws">
    </div>

    <div class="form-group">
        <label>HaMeR Path:</label>
        <input type="text" id="hamerPath" value="/path/to/file.hamer">
    </div>

    <div class="form-group">
        <label>FPS:</label>
        <input type="number" id="fps" value="60" min="1" max="120">
    </div>

    <button id="connectBtn" onclick="startWebSocket()">Connect & Start Inference</button>

    <div class="progress-bar" style="display: none;" id="progressContainer">
        <div class="progress-fill" id="progressBar" style="width: 0%">0%</div>
    </div>

    <div class="result-box" id="resultBox">
        <h3>✓ Result Received</h3>
        <div id="resultContent"></div>
    </div>

    <h3>Log:</h3>
    <div class="log" id="log"></div>

    <script>
        let ws = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateProgress(percentage) {
            const container = document.getElementById('progressContainer');
            const bar = document.getElementById('progressBar');
            container.style.display = 'block';
            bar.style.width = percentage + '%';
            bar.textContent = Math.round(percentage) + '%';
        }

        function displayResult(data) {
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');

            const metadata = data.metadata || {};
            let html = '<div>';

            if (metadata.segments_detected !== undefined) {
                html += `<p><strong>Segments Detected:</strong> ${metadata.segments_detected}</p>`;
            }
            if (metadata.total_frames !== undefined) {
                html += `<p><strong>Total Frames:</strong> ${metadata.total_frames}</p>`;
            }
            if (metadata.duration_seconds !== undefined) {
                html += `<p><strong>Duration:</strong> ${metadata.duration_seconds}s</p>`;
            }
            if (metadata.processing_time !== undefined) {
                html += `<p><strong>Processing Time:</strong> ${metadata.processing_time}s</p>`;
            }
            if (metadata.fps !== undefined) {
                html += `<p><strong>FPS:</strong> ${metadata.fps}</p>`;
            }

            if (data.srt_content) {
                const preview = data.srt_content.substring(0, 500);
                html += '<h4>SRT Content (first 500 chars):</h4>';
                html += `<pre>${preview}${data.srt_content.length > 500 ? '\n... (truncated)' : ''}</pre>`;
            }

            html += '</div>';
            resultContent.innerHTML = html;
            resultBox.style.display = 'block';
        }

        function setButtonState(disabled, text) {
            const btn = document.getElementById('connectBtn');
            btn.disabled = disabled;
            btn.textContent = text;
        }

        function startWebSocket() {
            const wsUrl = document.getElementById('wsUrl').value;
            const hamerPath = document.getElementById('hamerPath').value;
            const fps = parseInt(document.getElementById('fps').value);

            if (!hamerPath) {
                log('Please enter a HaMeR path', 'error');
                return;
            }

            // Clear previous results
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('log').innerHTML = '';

            log(`Connecting to ${wsUrl}...`, 'info');
            setButtonState(true, 'Connecting...');

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    log('✓ Connected to ISS Server', 'success');

                    const requestId = `js-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
                    const request = {
                        type: 'inference_request',
                        request_id: requestId,
                        hamer_path: hamerPath,
                        fps: fps
                    };

                    log(`Sending request: ${requestId}`, 'info');
                    log(`File: ${hamerPath}, FPS: ${fps}`, 'info');
                    ws.send(JSON.stringify(request));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);

                    switch (data.type) {
                        case 'ack':
                            log(`✓ ${data.message}`, 'success');
                            updateProgress(0);
                            break;

                        case 'progress':
                            const stage = data.stage || 'unknown';
                            const percentage = data.percentage || 0;
                            const msg = data.message || '';
                            log(`⟳ ${stage} (${percentage}%) ${msg}`, 'warning');
                            updateProgress(percentage);
                            break;

                        case 'result':
                            log('✓ Result received successfully!', 'success');
                            updateProgress(100);
                            displayResult(data);
                            setButtonState(false, 'Connect & Start Inference');
                            ws.close();
                            break;

                        case 'error':
                            log(`✗ Error: ${data.message}`, 'error');
                            if (data.error_code) {
                                log(`Error code: ${data.error_code}`, 'error');
                            }
                            setButtonState(false, 'Connect & Start Inference');
                            ws.close();
                            break;

                        default:
                            log(`Received: ${data.type}`, 'info');
                            break;
                    }
                };

                ws.onerror = (error) => {
                    log('✗ WebSocket error occurred', 'error');
                    console.error('WebSocket error:', error);
                    setButtonState(false, 'Connect & Start Inference');
                };

                ws.onclose = () => {
                    log('Connection closed', 'info');
                    setButtonState(false, 'Connect & Start Inference');
                };

            } catch (error) {
                log(`✗ Error: ${error.message}`, 'error');
                setButtonState(false, 'Connect & Start Inference');
            }
        }

        // Close WebSocket on page unload
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
