                    <select class="form-select" aria-label="Select Menu" id="selectUsersMenu">

                <div class="container">

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="startCalibration()">Calibratie Charuco Board</button>
                    <button type="button" class="btn btn-primary" onclick="ophalenData()">Beginnen</button>
                </div>

    <script>
countOpnames = 0;
let thema = "test";
let userId = 0;

$(document).ready(function(){

$("#selectUsers").modal({



});
//  $("#selectUsers").modal('show');

ophalenData("0", 0)
});

        let selectedType = 'Zin'; // Default to Zin

        function selectType(type) {
            selectedType = type;
        }

        function ophalenData(userId, glosId) {
            $("#signbankVideoDiv").css("width", "75%");
            $("#selectUsers").modal('hide');
            $("#myVideo1").hide();

            userId = parseInt($("#selectUsersMenu").val(), 10);
            // let thema = encodeURIComponent($("#selectThemaMenu").val());

            if (selectedType === 'Glos') {
                fetchGlosData(userId, glosId, thema);
            } else if (selectedType === 'Zin') {
                fetchZinnenData(userId, glosId, thema);
            }
        }

        function fetchGlosData(userId, glosId, thema) {
            fetch(`../fetch_all.php?limit=1000&offset=0&thema=${thema}&handle=themaFilter`)
                .then(response => response.text())
                .then(data => {
                    console.log(data);
                    let stopLoop = false;

                    data.forEach(item => {
                        if (stopLoop) return;

                        if (glosId) {
                            if (item.id.toString() === glosId.toString()) {
                                handleItem(item); 
                                stopLoop = true;
                            }
                        } else {
                            try {
                                videoTop = JSON.parse(item.videoTop) || [];
                                if (!Array.isArray(videoTop)) videoTop = [];
                            } catch {
                                videoTop = [];
                            }

                            if (videoTop.length === 0) {
                                handleItem(item);
                                stopLoop = true;
                            }
                        }
                    });

                    camerasReconnectStartupRunning = 0;
                    // countOpnames(data);
                })
                .catch(error => console.error('Error:', error));
        }

        function fetchZinnenData(userId, glosId, thema) {
            fetch(`getRows.php?&filterThema=${thema}`)
                .then(response => response.json())
                .then(data => {
                    let stopLoop = false;

                    data.rows.forEach(item => {
                        if (stopLoop) return;

                        if (glosId) {
                            if (item.ID.toString() === glosId.toString()) {
                                handleItem(item); 
                                stopLoop = true;
                            }
                        } else {
                            try {
                                videoTop = JSON.parse(item.videoTop) || [];
                                if (!Array.isArray(videoTop)) videoTop = [];
                            } catch {
                                videoTop = [];
                            }

                            if (videoTop.length === 0) {
                                handleItem(item);
                                stopLoop = true;
                            }
                        }
                    });

                    camerasReconnectStartupRunning = 0;
                    // countOpnames(data.rows);
                })
                .catch(error => console.error('Error:', error));
        }

        function handleItem(item) {
    $("#woordId").text(item.zinArray ? item.zinArray.join(' ') : item.glos);
    glosId = item.ID || item.id;

    if (selectedType === 'Zin') {
        // Fetch updated data from getRows.php if it's a Zin
        fetch(`getRows.php?id=${glosId}`)
            .then(response => response.json())
            .then(data => {
                const glosArray = data.glosArray;
                const sortArray = data.sortArray;
                console.log(glosId, glosArray, sortArray)
                updateVideoPlaylist(glosId, glosArray, sortArray);

            })
            .catch(error => console.error('Error fetching zin data:', error));
    } else {
        // Handle Glos type
        let zelfopname;
        if (!item.zelfopname || item.zelfopname === "[]") {
            zelfopname = `${item.zinArray ? item.zinArray[0] : item.glos}.mp4`;
        } else {
            try {
                zelfopname = JSON.parse(item.zelfopname);
                if (Array.isArray(zelfopname) && zelfopname.length > 0) {
                    zelfopname = zelfopname[0];
                } else {
                    zelfopname = `${item.zinArray ? item.zinArray[0] : item.glos}.mp4`;
                }
            } catch {
                zelfopname = `${item.zinArray ? item.zinArray[0] : item.glos}.mp4`;
            }
        }

   

        let videoElement = document.getElementById('signbankVideo');
        videoElement.src = `../uploads/${zelfopname}`;
        videoElement.load();
        videoElement.play();
        // checkAudioFile(glosId);
    }

    $("#videoContainer").hide();
        $("#officeVideoDiv").hide();
        $("#videoRow").show();

    let prevButton = document.getElementById('prevButton');
    let nextButton = document.getElementById('nextButton');

    prevButton.onclick = function() {
        prevCapture(glosId);
    };
    nextButton.onclick = function() {
        nextCapture(glosId);
    };
}

function updateVideoPlaylist(rowId, glosArray, sortArray) {
    const videoElement = document.getElementById('signbankVideo'); // Updated to use the main video element
    const wordDisplay = document.getElementById('videoPlayingText'); // Display current playing video in this element
    
    if (!sortArray) {
        // Create a default sortArray based on the length of glosArray
        sortArray = Array.from({ length: glosArray.length }, (_, i) => i.toString());
    }
    if (videoElement) {
        videoElement.innerHTML = ''; // Clear existing sources

        // Create an array to hold the video sources in the correct order
        const playlist = [];
        let currentIndex = 0;

        // Fetch all video URLs first based on the sortArray order
        const fetchPromises = sortArray.map((sortIndex, index) => {
            const glosID = glosArray[sortIndex]; // Map sortArray index to the corresponding glosArray element
            if (glosID) {
                return fetch(`https://leffe.science.uva.nl:8043/zin/getSenses.php?glosid=${glosID}`)
                    .then(response => response.json())
                    .then(data => {
                        const videoSource = data[0]?.video;
                        if (videoSource) {
                            playlist[index] = {
                                videoSource: videoSource,
                                word: data[0]?.glos
                            }; // Place the video in the correct position
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching video for glosID:', error);
                    });
            }
        });

        // Once all videos are fetched, set up the playlist
        Promise.all(fetchPromises).then(() => {
            const filteredPlaylist = playlist.filter(item => item !== undefined);
            if (filteredPlaylist.length > 0) {
                loadVideo(currentIndex);

                videoElement.addEventListener('ended', () => {
                    currentIndex++;
                    if (currentIndex >= filteredPlaylist.length) {
                        currentIndex = 0; // Reset to the first video
                    }
                    loadVideo(currentIndex);
                });
            }

            function loadVideo(index) {
                videoElement.src = filteredPlaylist[index].videoSource;
                wordDisplay.innerText = `${filteredPlaylist[index].word}`;
                videoElement.load();
                videoElement.play(); // Auto play the video
            }
        });
    }
}



        function nextCapture(glosId) {
            console.log(glosId)
            console.log(thema);

            let fetchUrl = selectedType === 'Glos' 
                ? `fetch_all.php?limit=500&offset=0&thema=${thema}&handle=themaFilter`
                : `getRows.php?filterThema=${thema}`;

            fetch(fetchUrl)
                .then(response => response.json())
                .then(data => {
                    let rows = selectedType === 'Glos' ? data : data.rows;
                    let keyNumber = -1;

                    console.log(rows)

                    for (let i = 0; i < rows.length; i++) {
                        if ((rows[i].ID || rows[i].id).toString() === glosId.toString()) {
                            keyNumber = i;
                            break;
                        }
                    }

                    if (keyNumber >= 0 && keyNumber < rows.length - 1) {
                        let nextKey = keyNumber + 1;
                        ophalenData(userId, rows[nextKey].ID || rows[nextKey].id);
                    } else {
                        return null;
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function prevCapture(glosId) {
            let thema = encodeURIComponent($("#selectThemaMenu").val());

            let fetchUrl = selectedType === 'Glos' 
                ? `fetch_all.php?limit=500&offset=0&thema=${thema}&handle=themaFilter`
                : `getRows.php?limit=500&offset=0&thema=${thema}`;

            fetch(fetchUrl)
                .then(response => response.json())
                .then(data => {
                    let rows = selectedType === 'Glos' ? data : data.rows;
                    let keyNumber = -1;

                    for (let i = 0; i < rows.length; i++) {
                        if ((rows[i].ID || rows[i].id).toString() === glosId.toString()) {
                            keyNumber = i;
                            break;
                        }
                    }

                    if (keyNumber > 0) {
                        let previousKey = keyNumber - 1;
                        ophalenData(userId, rows[previousKey].ID || rows[previousKey].id);
                    } else {
                        return null;
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function startCalibration() {
            // Calibration code goes here
            console.log('Calibration started');
        }

        function openOpnameView() {
            // Open opname view code goes here
            console.log('Opening opname view');
        }
    </script>
